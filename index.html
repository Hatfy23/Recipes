<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despensa & Receitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E2420;
    --bg-2:#191E1B;
    --surface:#262C27;
    --surface-2:#2E352F;
    --surface-hover:#343C35;
    --border:#3B4339;
    --text:#F0EDE4;
    --text-dim:#A9B2A2;
    --text-faint:#707A6E;
    --accent:#C1793F;
    --accent-dim:#8F5A30;
    --sage:#829772;
    --sage-dim:#5C6E53;
    --danger:#C1443B;
    --danger-dim:#3A2523;
    --warning:#D4A24C;
    --font-display:'Roboto Slab', serif;
    --font-body:'Work Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(193,121,63,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(130,151,114,0.06), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim);color:var(--text);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:var(--accent);}

  /* ---------- HEADER ---------- */
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--bg-2) 0%, rgba(25,30,27,0.94) 100%);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 20px 0 20px;
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dim));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;color:#1E2420;font-size:16px;
    flex-shrink:0;
  }
  .brand h1{
    font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;letter-spacing:0.2px;
  }
  .brand .sub{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:0.3px;}
  .header-actions{display:flex;gap:8px;align-items:center;}
  .sync-indicator{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);padding:0 4px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0;transition:background .2s;}
  .sync-dot.synced{background:var(--sage);}
  .sync-dot.saving{background:var(--warning);animation:pulseDot 1s infinite;}
  .sync-dot.offline{background:var(--danger);}
  .sync-dot.loading{background:var(--text-faint);animation:pulseDot 1s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .icon-btn{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    border-radius:var(--radius-sm);padding:7px 11px;font-size:12.5px;display:flex;align-items:center;gap:6px;
    transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--text-faint);}

  .tabs{max-width:1180px;margin:14px auto 0 auto;display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;}
  .tab-btn{white-space:nowrap;}
  .tab-btn{
    background:none;border:none;color:var(--text-faint);
    padding:10px 4px;font-size:14.5px;font-weight:600;font-family:var(--font-display);
    border-bottom:2px solid transparent;margin-right:22px;letter-spacing:0.2px;
    transition:color .15s;
  }
  .tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}
  .tab-btn:hover{color:var(--text);}
  .tab-badge{
    display:inline-block;margin-left:6px;background:var(--danger-dim);color:#E7A199;
    font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:20px;vertical-align:2px;
  }

  main{max-width:1180px;margin:0 auto;padding:22px 20px 80px 20px;}

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;
  }
  .search-box{
    flex:1;min-width:180px;position:relative;
  }
  .search-box input{
    width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:9px 12px 9px 32px;border-radius:var(--radius-sm);font-size:13.5px;outline:none;
  }
  .search-box input:focus{border-color:var(--accent-dim);}
  .search-box::before{
    content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:15px;
  }
  select.filter-select{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    padding:9px 10px;border-radius:var(--radius-sm);font-size:13px;outline:none;
  }
  .toggle-chip{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    padding:8px 13px;border-radius:20px;font-size:12.5px;display:flex;align-items:center;gap:6px;
    transition:all .15s;
  }
  .toggle-chip.active{background:var(--danger-dim);color:#E7A199;border-color:#5A302C;}
  .btn-primary{
    background:var(--accent);border:1px solid var(--accent);color:#1B211D;font-weight:700;
    padding:9px 15px;border-radius:var(--radius-sm);font-size:13.5px;white-space:nowrap;
    transition:filter .15s;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:9px 15px;border-radius:var(--radius-sm);font-size:13.5px;
  }
  .btn-secondary:hover{background:var(--surface-hover);}
  .btn-ghost{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    padding:8px 13px;border-radius:var(--radius-sm);font-size:12.5px;
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--text-faint);}
  .btn-danger-ghost{
    background:none;border:1px solid #4A2E2B;color:#D08A82;
    padding:8px 13px;border-radius:var(--radius-sm);font-size:12.5px;
  }
  .btn-danger-ghost:hover{background:var(--danger-dim);}

  /* ---------- GRID / CARDS ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(230px,1fr));gap:14px;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s, transform .15s;
    position:relative;
  }
  .card:hover{border-color:var(--text-faint);}
  .card-photo{
    width:100%;height:120px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;
    color:var(--text-faint);font-size:30px;overflow:hidden;
  }
  .card-photo img{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:11px 13px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .card-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .card-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;line-height:1.25;}
  .card-cat{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.4px;}
  .card-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;flex-shrink:0;}
  .card:hover .card-actions{opacity:1;}
  .mini-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    width:24px;height:24px;border-radius:6px;font-size:12px;display:flex;align-items:center;justify-content:center;
  }
  .mini-btn:hover{background:var(--surface-hover);color:var(--text);}

  /* gauge */
  .gauge-wrap{margin-top:2px;}
  .gauge-track{
    position:relative;height:8px;background:var(--surface-2);border-radius:6px;overflow:visible;border:1px solid var(--border);
  }
  .gauge-fill{position:absolute;top:0;left:0;height:100%;border-radius:6px;transition:width .2s;}
  .gauge-min-tick{position:absolute;top:-2px;width:2px;height:12px;background:var(--text-faint);border-radius:1px;}
  .gauge-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:4px;}
  .status-pill{font-size:10px;font-family:var(--font-mono);padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .status-low{background:var(--danger-dim);color:#E7A199;}
  .status-ok{background:#33402F;color:#B9CBA8;}
  .status-full{background:#3E3323;color:var(--warning);}

  .price-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-dim);}
  .price-row .price{font-family:var(--font-mono);color:var(--text);font-weight:500;}

  /* recipe readiness badge */
  .ready-badge{font-size:10.5px;font-family:var(--font-mono);padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
  .ready-yes{background:#2E3B29;color:#A6CB8E;}
  .ready-no{background:var(--danger-dim);color:#E7A199;}
  .ready-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-faint);
  }
  .empty-state .glyph{font-size:34px;margin-bottom:10px;}
  .empty-state h3{font-family:var(--font-display);color:var(--text-dim);font-weight:600;margin:0 0 6px 0;}
  .empty-state p{font-size:13px;max-width:340px;margin:0 auto;}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,10,0.65);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto;z-index:100;
  }
  .modal{
    background:var(--bg-2);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:560px;padding:0;animation:modalIn .16s ease-out;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .modal-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px;border-bottom:1px solid var(--border);
  }
  .modal-header h2{font-family:var(--font-display);font-size:17px;margin:0;font-weight:600;}
  .modal-close{background:none;border:none;color:var(--text-faint);font-size:20px;line-height:1;padding:4px;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:20px 22px;max-height:72vh;overflow-y:auto;}
  .modal-footer{
    padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
  }

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;letter-spacing:0.2px;}
  .field .hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
  .field input[type=text], .field input[type=number], .field input[type=url], .field select, .field textarea{
    width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:var(--radius-sm);font-size:13.5px;outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent-dim);}
  .field textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  fieldset{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px 6px 14px;margin:0 0 14px 0;}
  legend{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.4px;padding:0 6px;}

  .photo-upload{
    display:flex;align-items:center;gap:12px;
  }
  .photo-upload input[type=url]{
    flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:var(--radius-sm);font-size:13px;outline:none;
  }
  .photo-upload input[type=url]:focus{border-color:var(--accent-dim);}
  .photo-preview{
    width:76px;height:76px;border-radius:10px;background:var(--surface);border:1px dashed var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:22px;overflow:hidden;flex-shrink:0;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover;}

  /* ingredient row inside recipe form */
  .ing-row{
    display:grid;grid-template-columns:1fr 90px 30px;gap:8px;align-items:center;margin-bottom:8px;
  }
  .ing-row select, .ing-row input{
    background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);
    padding:8px 9px;font-size:13px;
  }
  .remove-row-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-faint);
    width:30px;height:32px;border-radius:6px;font-size:15px;
  }
  .remove-row-btn:hover{color:#E7A199;border-color:#4A2E2B;}

  /* ---------- RECIPE DETAIL ---------- */
  .detail-photo{width:100%;height:190px;border-radius:10px;background:var(--surface);overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:36px;}
  .detail-photo img{width:100%;height:100%;object-fit:cover;}
  .banner{
    padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:500;
  }
  .banner.good{background:#26301F;color:#B9CBA8;border:1px solid #3A4A2F;}
  .banner.bad{background:var(--danger-dim);color:#E7A199;border:1px solid #4A2E2B;}
  .servings-control{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .step-btn{
    width:28px;height:28px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:16px;
  }
  .step-btn:hover{background:var(--surface-hover);}
  .servings-val{font-family:var(--font-mono);font-size:14px;min-width:70px;text-align:center;}

  .ingredient-check-list{list-style:none;padding:0;margin:0 0 16px 0;}
  .ingredient-check-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;
  }
  .ingredient-check-list li:last-child{border-bottom:none;}
  .ic-name{display:flex;align-items:center;gap:9px;}
  .ic-mark{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  .ic-mark.yes{background:#2E3B29;color:#A6CB8E;}
  .ic-mark.no{background:var(--danger-dim);color:#E7A199;}
  .ic-qty{font-family:var(--font-mono);color:var(--text-dim);font-size:12.5px;}
  .ic-missing{color:#E7A199;font-size:11px;font-family:var(--font-mono);}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center;}
  .stat-box .val{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--text);}
  .stat-box .lbl{font-size:9.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}

  .link-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .link-btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:12.5px;text-decoration:none;
  }
  .link-btn:hover{background:var(--surface-hover);}

  .instructions-block{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;color:var(--text-dim);margin-bottom:16px;
  }

  .detail-footer-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}

  /* ---------- CART ---------- */
  .cart-section-title{
    font-family:var(--font-display);font-size:14.5px;font-weight:600;margin:22px 0 10px 0;
    display:flex;align-items:center;gap:8px;
  }
  .cart-section-title:first-child{margin-top:0;}
  .cart-section-title .count{
    font-family:var(--font-mono);font-size:11px;color:var(--text-faint);font-weight:400;
    background:var(--surface);border:1px solid var(--border);padding:1px 8px;border-radius:20px;
  }
  .suggestion-list, .cart-list{list-style:none;padding:0;margin:0;}
  .suggestion-row, .cart-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;
  }
  .cart-row.checked{opacity:0.55;}
  .cart-row-thumb, .suggestion-row-thumb{
    width:34px;height:34px;border-radius:7px;background:var(--surface-2);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:15px;color:var(--text-faint);
  }
  .cart-row-thumb img, .suggestion-row-thumb img{width:100%;height:100%;object-fit:cover;}
  .row-main{flex:1;min-width:0;}
  .row-name{font-size:13.5px;font-weight:500;}
  .row-sub{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);margin-top:2px;}
  .type-tag{
    font-size:9.5px;font-family:var(--font-mono);padding:2px 6px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;
    background:var(--surface-2);color:var(--text-faint);border:1px solid var(--border);
  }
  .cart-qty-input{
    width:64px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:6px 8px;border-radius:6px;font-size:12.5px;font-family:var(--font-mono);text-align:center;
  }
  .cart-check{width:18px;height:18px;accent-color:var(--sage);flex-shrink:0;cursor:pointer;}
  .cart-footer-bar{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
  }
  .cart-total-block{display:flex;flex-direction:column;gap:2px;}
  .cart-total-line{font-size:13px;color:var(--text-dim);}
  .cart-total-line strong{color:var(--text);font-family:var(--font-mono);font-weight:600;}
  .cart-total-line.sub{font-size:11.5px;color:var(--text-faint);}
  .cart-row-cost{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);min-width:56px;text-align:right;}
  .history-qty{font-family:var(--font-mono);font-size:13px;color:var(--text);font-weight:500;}

  /* ---------- CONSUMABLE STEPPER ---------- */
  .consumable-tag{
    font-size:9.5px;font-family:var(--font-mono);padding:1px 6px;border-radius:20px;text-transform:uppercase;
    letter-spacing:0.3px;background:var(--accent-dim);color:#F0D9BF;display:inline-block;margin-top:2px;
  }
  .stepper-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px;}
  .step-btn-sm{
    width:24px;height:24px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .step-btn-sm:hover{background:var(--surface-hover);}
  .stepper-row .stepper-label{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .checkbox-field{display:flex;align-items:center;gap:8px;}
  .checkbox-field input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .checkbox-field label{margin:0;font-size:12.5px;color:var(--text);font-weight:500;cursor:pointer;}

  /* ---------- MEAL PLAN ---------- */
  .field input[type=date]{
    width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:var(--radius-sm);font-size:13.5px;outline:none;color-scheme:dark;
  }
  .field input[type=date]:focus{border-color:var(--accent-dim);}
  .plan-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .plan-nav{display:flex;gap:6px;align-items:center;}

  .meal-add{background:none;border:1px dashed var(--border);color:var(--text-faint);border-radius:var(--radius-sm);padding:6px;font-size:11.5px;}
  .meal-add:hover{color:var(--text);border-color:var(--text-faint);}
  .day-total{border-top:1px solid var(--border);padding:9px 12px;background:var(--bg-2);border-radius:0 0 var(--radius) var(--radius);}
  .day-total .lbl{font-size:9.5px;text-transform:uppercase;color:var(--text-faint);letter-spacing:0.4px;}
  .day-total .kcal{font-family:var(--font-mono);font-size:15px;font-weight:600;}
  .day-total .macros{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-top:2px;line-height:1.55;}
  .month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .month-dow{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;text-align:center;padding:4px 0;}
  .month-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);min-height:96px;padding:6px 7px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;display:flex;flex-direction:column;gap:2px;overflow:hidden;}
  .month-cell:hover{background:var(--surface-hover);}
  .month-cell.other{opacity:0.42;}
  .month-cell.today{border-color:var(--accent);}
  .month-cell .mnum{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .month-cell .mline{font-size:10.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .month-cell .mkcal{margin-top:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--text);}
  .weekday-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-check{position:relative;}

  .chip-check input:checked + span{background:var(--accent-dim);color:#F0D9BF;border-color:var(--accent);}

  .choice-actions{display:flex;flex-direction:column;gap:8px;}

  /* ---------- DASHBOARD STRIP ---------- */

  /* ---------- TOAST ---------- */
  #toast-holder{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,0.3);
    animation:toastIn .18s ease-out; max-width:280px;
  }
  .toast.error{border-color:#4A2E2B;color:#E7A199;}

  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:640px){
    .field-row, .field-row-3{grid-template-columns:1fr;}

</style>

<main>

  <div id="view-recipes" style="display:none;"></div>
  <div id="view-plan" style="display:none;"></div>
  <div id="view-cart" style="display:none;"></div>
</main>

<div id="modal-root"></div>
<div id="toast-holder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";

/* ============================================================
   SUPABASE (cloud sync)
   Nova tabela isolada: não toca em nenhuma outra tabela do projeto.
============================================================ */
const SUPABASE_URL = 'https://cfdzwduajsatbydphrtq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ddMVcKindWWg_YeEokcUuA_IAeG9GcT';
const SB_TABLE = 'despensa_receitas_store';
const SB_ROW_ID = 'default';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let pushTimer = null;
let syncInFlight = false;

function setSyncStatus(status){
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-text');
  if(!dot || !text) return;
  dot.className = 'sync-dot ' + status;
  const labels = { loading:'Carregando...', synced:'Sincronizado', saving:'Salvando...', offline:'Sem conexão · salvo localmente' };
  text.textContent = labels[status] || '';
}

async function syncFromCloud(showToast){
  setSyncStatus('loading');
  try{
    const { data, error } = await sb.from(SB_TABLE).select('data').eq('id', SB_ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data){
      state.ingredients = data.data.ingredients || [];
      state.recipes = data.data.recipes || [];
      state.despensaItems = data.data.despensaItems || [];
      state.cart = data.data.cart || [];
      state.purchaseLog = data.data.purchaseLog || {};
      state.mealPlan = data.data.mealPlan || [];
      persistLocal();
      renderAll();
      setSyncStatus('synced');
      if(showToast) toast('Dados atualizados da nuvem', 'success');
    } else {
      await pushToCloud();
      if(showToast) toast('Nenhum dado na nuvem ainda — enviando dados locais', 'success');
    }
  }catch(err){
    console.error('Falha ao buscar dados da nuvem', err);
    setSyncStatus('offline');
    if(showToast) toast('Sem conexão com a nuvem no momento', 'error');
  }
}

async function pushToCloud(){
  setSyncStatus('saving');
  syncInFlight = true;
  try{
    const { error } = await sb.from(SB_TABLE).upsert({
      id: SB_ROW_ID,
      data: { ingredients: state.ingredients, recipes: state.recipes, despensaItems: state.despensaItems, cart: state.cart, purchaseLog: state.purchaseLog, mealPlan: state.mealPlan },
      updated_at: new Date().toISOString()
    });
    if(error) throw error;
    setSyncStatus('synced');
  }catch(err){
    console.error('Falha ao salvar na nuvem', err);
    setSyncStatus('offline');
  } finally {
    syncInFlight = false;
  }
}

function schedulePush(){
  setSyncStatus('saving');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToCloud, 700);
}

/* ============================================================
   STATE & STORAGE
============================================================ */
const STORAGE_KEYS = { ing: 'despensa_ingredients_v1', rec: 'despensa_recipes_v1', desp: 'despensa_household_v1', cart: 'despensa_cart_v1', hist: 'despensa_purchase_log_v1', plan: 'despensa_meal_plan_v1' };
const UNIT_LABEL = { g: 'g', ml: 'ml', un: 'un' };
const CATEGORY_SUGGESTIONS = ['Grãos e Cereais','Laticínios','Carnes e Ovos','Vegetais','Frutas','Temperos e Molhos','Bebidas','Enlatados','Congelados','Padaria','Outros'];
const DESPENSA_UNIT_SUGGESTIONS = ['un','rolo','tubo','pacote','frasco','caixa','barra','litro','kg'];
const DESPENSA_CATEGORY_SUGGESTIONS = ['Higiene Pessoal','Limpeza','Banheiro','Cozinha (não alimento)','Papelaria','Pet','Outros'];
const MONTH_NAMES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

let state = { ingredients: [], recipes: [], despensaItems: [], cart: [], purchaseLog: {}, mealPlan: [] };
let currentTab = 'ingredients';
let ingSearch = '';
let ingCategoryFilter = '';
let ingLowStockOnly = false;
let recSearch = '';
let recReadyOnly = false;
let despSearch = '';
let despCategoryFilter = '';
let despLowStockOnly = false;
let historySelectedMonth = null;

function loadLocalState(){
  try{
    const rawIng = localStorage.getItem(STORAGE_KEYS.ing);
    const rawRec = localStorage.getItem(STORAGE_KEYS.rec);
    const rawDesp = localStorage.getItem(STORAGE_KEYS.desp);
    const rawCart = localStorage.getItem(STORAGE_KEYS.cart);
    const rawHist = localStorage.getItem(STORAGE_KEYS.hist);
    const rawPlan = localStorage.getItem(STORAGE_KEYS.plan);
    state.ingredients = rawIng ? JSON.parse(rawIng) : [];
    state.recipes = rawRec ? JSON.parse(rawRec) : [];
    state.despensaItems = rawDesp ? JSON.parse(rawDesp) : [];
    state.cart = rawCart ? JSON.parse(rawCart) : [];
    state.purchaseLog = rawHist ? JSON.parse(rawHist) : {};
    state.mealPlan = rawPlan ? JSON.parse(rawPlan) : [];
  }catch(e){
    console.error('Falha ao carregar dados salvos localmente', e);
    state = { ingredients: [], recipes: [], despensaItems: [], cart: [], purchaseLog: {}, mealPlan: [] };
  }
}
function persistLocal(){
  try{
    localStorage.setItem(STORAGE_KEYS.ing, JSON.stringify(state.ingredients));
    localStorage.setItem(STORAGE_KEYS.rec, JSON.stringify(state.recipes));
    localStorage.setItem(STORAGE_KEYS.desp, JSON.stringify(state.despensaItems));
    localStorage.setItem(STORAGE_KEYS.cart, JSON.stringify(state.cart));
    localStorage.setItem(STORAGE_KEYS.hist, JSON.stringify(state.purchaseLog));
    localStorage.setItem(STORAGE_KEYS.plan, JSON.stringify(state.mealPlan));
  }catch(e){ console.error('Falha ao salvar localmente', e); }
}
// Salva só o que mudou, uma única vez, fora do caminho do clique (UI responde na hora)
const dirtyKeys = new Set();
let flushScheduled = false;
function flushLocal(){
  flushScheduled = false;
  const fieldByKey = { ing:'ingredients', rec:'recipes', desp:'despensaItems', cart:'cart', hist:'purchaseLog', plan:'mealPlan' };
  dirtyKeys.forEach(k => {
    try{ localStorage.setItem(STORAGE_KEYS[k], JSON.stringify(state[fieldByKey[k]])); }
    catch(e){ console.error('Falha ao salvar localmente', e); }
  });
  dirtyKeys.clear();
}
function markDirty(key){
  dirtyKeys.add(key);
  if(!flushScheduled){ flushScheduled = true; setTimeout(flushLocal, 0); }
  schedulePush();
}
function saveIngredients(){ markDirty('ing'); }
function saveRecipes(){ markDirty('rec'); }
function saveDespensa(){ markDirty('desp'); }
function saveCart(){ markDirty('cart'); }
function saveHistory(){ markDirty('hist'); }
function saveMealPlan(){ markDirty('plan'); }

function debounce(fn, ms){
  let t = null;
  return function(){ clearTimeout(t); const a = arguments; t = setTimeout(()=>fn.apply(null, a), ms); };
}

function monthKeyNow(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  const [y,m] = key.split('-');
  return `${MONTH_NAMES_PT[parseInt(m,10)-1]} de ${y}`;
}
function logPurchase(refType, refId, name, unit, qty){
  const key = monthKeyNow();
  if(!state.purchaseLog[key]) state.purchaseLog[key] = {};
  const itemKey = refType + ':' + refId;
  const bucket = state.purchaseLog[key];
  if(!bucket[itemKey]) bucket[itemKey] = { name, unit, qty: 0 };
  bucket[itemKey].name = name;
  bucket[itemKey].unit = unit;
  bucket[itemKey].qty = Math.round((bucket[itemKey].qty + qty) * 100) / 100;
}

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

/* ============================================================
   HELPERS
============================================================ */
function fmtNum(n){
  if(n === null || n === undefined || isNaN(n)) return '0';
  const r = Math.round(n*100)/100;
  return r.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
}
function fmtCurrency(n){
  if(n === null || n === undefined || isNaN(n)) n = 0;
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function fmtMinutes(min){
  min = Math.round(min || 0);
  if(min < 60) return min + ' min';
  const h = Math.floor(min/60), m = min % 60;
  return h + 'h' + (m ? ' ' + m + 'min' : '');
}
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function unitLabel(u){ return UNIT_LABEL[u] || u; }

function toast(msg, type){
  const holder = document.getElementById('toast-holder');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  holder.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 300); }, 2600);
}

/* nutrition & price basis helpers
   ingredient.nutrition = { calories, protein, carbs, fat } => values per 100 (g/ml) or per unit (un)
   ingredient.price, ingredient.priceQty => price refers to priceQty units of ingredient.unit
*/
function pricePerBaseUnit(ing){
  if(!ing.price || !ing.priceQty) return 0;
  return ing.price / ing.priceQty;
}
function costForQuantity(ing, qty){
  return pricePerBaseUnit(ing) * qty;
}
function nutritionForQuantity(ing, qty){
  const n = ing.nutrition || {};
  const factor = ing.unit === 'un' ? qty : (qty/100);
  return {
    calories: (n.calories||0) * factor,
    protein: (n.protein||0) * factor,
    carbs: (n.carbs||0) * factor,
    fat: (n.fat||0) * factor
  };
}

function stockStatus(ing){
  if(ing.stockCurrent < ing.stockMin) return 'low';
  if(ing.stockMax && ing.stockCurrent >= ing.stockMax) return 'full';
  return 'ok';
}

function computeReadiness(recipe, servingsOverride){
  const factor = servingsOverride ? (servingsOverride / (recipe.servings || 1)) : 1;
  let readyCount = 0;
  const rows = (recipe.ingredients||[]).map(ri => {
    const ing = state.ingredients.find(i => i.id === ri.ingredientId);
    const needed = (ri.quantity||0) * factor;
    if(!ing){
      return { ri, ing:null, needed, have:0, ok:false, missing:needed };
    }
    const ok = ing.stockCurrent >= needed;
    if(ok) readyCount++;
    return { ri, ing, needed, have: ing.stockCurrent, ok, missing: Math.max(0, needed - ing.stockCurrent) };
  });
  return { rows, ready: rows.every(r=>r.ok) && rows.length>0, readyCount, total: rows.length };
}

/* ============================================================
   MODAL HELPERS
============================================================ */
function openModal(html, onMount){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" id="active-overlay"><div class="modal">${html}</div></div>`;
  const overlay = document.getElementById('active-overlay');
  overlay.addEventListener('mousedown', (e) => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', escCloseHandler);
  if(onMount) onMount();
}
function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
  document.removeEventListener('keydown', escCloseHandler);
}
function escCloseHandler(e){ if(e.key === 'Escape') closeModal(); }

/* ============================================================
   TABS
============================================================ */
function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-btn-ingredients').classList.toggle('active', tab==='ingredients');
  document.getElementById('tab-btn-despensa').classList.toggle('active', tab==='despensa');
  document.getElementById('tab-btn-recipes').classList.toggle('active', tab==='recipes');
  document.getElementById('tab-btn-plan').classList.toggle('active', tab==='plan');
  document.getElementById('tab-btn-cart').classList.toggle('active', tab==='cart');
  document.getElementById('view-ingredients').style.display = tab==='ingredients' ? 'block' : 'none';
  document.getElementById('view-despensa').style.display = tab==='despensa' ? 'block' : 'none';
  document.getElementById('view-recipes').style.display = tab==='recipes' ? 'block' : 'none';
  document.getElementById('view-plan').style.display = tab==='plan' ? 'block' : 'none';
  document.getElementById('view-cart').style.display = tab==='cart' ? 'block' : 'none';
  renderAll();
}

/* ============================================================
   RENDER: INGREDIENTS VIEW
============================================================ */
function renderIngredientsView(){
  const container = document.getElementById('view-ingredients');
  const lowCount = state.ingredients.filter(i => stockStatus(i)==='low').length;

  let filtered = state.ingredients.filter(i => {
    if(ingSearch && !i.name.toLowerCase().includes(ingSearch.toLowerCase())) return false;
    if(ingCategoryFilter && i.category !== ingCategoryFilter) return false;
    if(ingLowStockOnly && stockStatus(i) !== 'low') return false;
    return true;
  }).sort((a,b)=> a.name.localeCompare(b.name, 'pt-BR'));

  const categories = Array.from(new Set(state.ingredients.map(i=>i.category).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'pt-BR'));

  let dashHtml = '';
  if(state.ingredients.length){
    dashHtml = `
    <div class="dash-strip">
      <div class="dash-card"><div class="num">${state.ingredients.length}</div><div class="lbl">Ingredientes cadastrados</div></div>
      <div class="dash-card ${lowCount>0?'danger':''}"><div class="num">${lowCount}</div><div class="lbl">Abaixo do estoque mínimo</div></div>
      <div class="dash-card"><div class="num">${fmtCurrency(state.ingredients.reduce((s,i)=>s+costForQuantity(i,i.stockCurrent),0))}</div><div class="lbl">Valor estimado em estoque</div></div>
    </div>`;
  }

  let cardsHtml;
  if(!state.ingredients.length){
    cardsHtml = `<div class="empty-state"><div class="glyph">🧺</div><h3>Sua despensa está vazia</h3><p>Cadastre seu primeiro ingrediente com preço, informações nutricionais e estoque.</p></div>`;
  } else if(!filtered.length){
    cardsHtml = `<div class="empty-state"><div class="glyph">🔍</div><h3>Nada encontrado</h3><p>Ajuste a busca ou os filtros.</p></div>`;
  } else {
    cardsHtml = `<div class="grid">` + filtered.map(renderIngredientCard).join('') + `</div>`;
  }

  container.innerHTML = `
    ${dashHtml}
    <div class="toolbar">
      <div class="search-box"><input type="text" id="ing-search-input" placeholder="Buscar ingrediente..." value="${escapeHtml(ingSearch)}"></div>
      <select class="filter-select" id="ing-category-filter">

function adjustConsumableStock(type, id, delta){
  const source = type==='ingredient' ? state.ingredients : state.despensaItems;
  const idx = source.findIndex(i => i.id === id);
  if(idx < 0) return;
  const step = source[idx].step > 0 ? source[idx].step : 1;
  source[idx].stockCurrent = Math.max(0, Math.round((source[idx].stockCurrent + delta * step) * 100) / 100);
  if(type==='ingredient'){ saveIngredients(); renderIngredientsView(); }
  else { saveDespensa(); renderDespensaView(); }
  updateTabBadges();
}

function deleteIngredient(id){
  const ing = state.ingredients.find(i=>i.id===id);
  if(!ing) return;
  const usedIn = state.recipes.filter(r => (r.ingredients||[]).some(ri=>ri.ingredientId===id));
  const warn = usedIn.length ? `\n\nEste ingrediente é usado em ${usedIn.length} receita(s). Ele será removido delas.` : '';
  if(!confirm(`Excluir "${ing.name}"?${warn}`)) return;
  state.ingredients = state.ingredients.filter(i=>i.id!==id);
  state.recipes.forEach(r => { r.ingredients = (r.ingredients||[]).filter(ri=>ri.ingredientId!==id); });
  state.cart = state.cart.filter(c => !(c.refType==='ingredient' && c.refId===id));
  saveIngredients();
  saveRecipes();
  saveCart();
  toast('Ingrediente excluído', 'success');
  renderAll();
}

  const categories = Array.from(new Set(state.despensaItems.map(i=>i.category).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'pt-BR'));

  document.getElementById('btn-add-despensa').onclick = ()=> openDespensaForm();

  container.querySelectorAll('[data-edit-desp]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); openDespensaForm(btn.dataset.editDesp); };

function deleteDespensaItem(id){
  const item = state.despensaItems.find(i=>i.id===id);
  if(!item) return;
  if(!confirm(`Excluir "${item.name}"?`)) return;
  state.despensaItems = state.despensaItems.filter(i=>i.id!==id);
  state.cart = state.cart.filter(c => !(c.refType==='despensa' && c.refId===id));
  saveDespensa();
  saveCart();
  toast('Item excluído', 'success');
  renderAll();
}

function renderRecipesView(){

  let filtered = state.recipes.filter(r => {

  }).sort((a,b)=> a.name.localeCompare(b.name, 'pt-BR'));

  let cardsHtml;
  if(!state.recipes.length){
    cardsHtml = `<div class="empty-state"><div class="glyph">📖</div><h3>Nenhuma receita ainda</h3><p>Cadastre suas receitas e veja na hora se sua despensa dá conta.</p></div>`;

  state.recipes = state.recipes.filter(r=>r.id!==id);
  state.mealPlan = state.mealPlan.filter(m => m.recipeId !== id);
  saveRecipes();
  saveMealPlan();
  toast('Receita excluída', 'success');
  renderAll();
}

      </div>

      <ul class="ingredient-check-list">

          <li>
            <span class="ic-name">

            </span>
            <span class="ic-qty">

      ${(rec.videoLink || rec.siteLink) ? `

        ${rec.siteLink ? `<a class="link-btn" href="${escapeHtml(rec.siteLink)}" target="_blank" rel="noopener">🔗 Ver receita original</a>` : ''}

/* ============================================================
   RENDER: CART VIEW (carrinho de compras)
============================================================ */
function getCartCandidates(){
  // itens abaixo do mínimo, tanto ingredientes quanto despensa, que ainda não estão no carrinho
  const inCart = (type, id) => state.cart.some(c => c.refType===type && c.refId===id);
  const fromIngredients = state.ingredients
    .filter(i => stockStatus(i)==='low' && !inCart('ingredient', i.id))
    .map(i => ({ type:'ingredient', item:i }));
  const fromDespensa = state.despensaItems
    .filter(i => stockStatus(i)==='low' && !inCart('despensa', i.id))
    .map(i => ({ type:'despensa', item:i }));
  return [...fromIngredients, ...fromDespensa].sort((a,b)=>a.item.name.localeCompare(b.item.name,'pt-BR'));
}

function suggestedQty(item){
  if(item.stockMax && item.stockMax > item.stockCurrent) return Math.round((item.stockMax - item.stockCurrent)*100)/100;
  return Math.max(1, Math.round((item.stockMin - item.stockCurrent)*100)/100);
}

function addToCartManual(type, id){
  const source = type==='ingredient' ? state.ingredients : state.despensaItems;
  const item = source.find(i => i.id === id);
  if(!item) return;
  if(state.cart.some(c => c.refType===type && c.refId===id)){
    toast('Esse item já está no carrinho', 'error');
    return;
  }
  state.cart.push({ id: uid(), refType: type, refId: id, name: item.name, unit: item.unit, quantity: suggestedQty(item), checked: false });
  saveCart();
  toast(`${item.name} adicionado ao carrinho`, 'success');
  updateTabBadges();
  if(currentTab === 'cart') renderCartView();
}

function renderPurchaseHistorySection(){
  const months = Object.keys(state.purchaseLog).sort().reverse();
  if(!months.length){
    return `
      <div class="cart-section-title" style="margin-top:28px;">Histórico de compras <span class="count">0</span></div>
      <p class="hint" style="margin-bottom:10px;">Nenhuma compra finalizada ainda. Ao dar check-out no carrinho, os itens entram aqui, somados por mês.</p>
    `;
  }
  const selected = (historySelectedMonth && months.includes(historySelectedMonth)) ? historySelectedMonth : months[0];
  const bucket = state.purchaseLog[selected] || {};
  const rows = Object.values(bucket).sort((a,b)=> a.name.localeCompare(b.name,'pt-BR'));

  return `
    <div class="cart-section-title" style="margin-top:28px;">Histórico de compras <span class="count">${months.length} ${months.length===1?'mês':'meses'}</span></div>
    <div class="toolbar" style="margin-bottom:10px;">
      <select class="filter-select" id="history-month-select">
        ${months.map(m => `<option value="${m}" ${m===selected?'selected':''}>${monthLabel(m)}</option>`).join('')}
      </select>
    </div>
    <ul class="cart-list">
      ${rows.length ? rows.map(r => `
        <li class="cart-row">
          <div class="row-main">
            <div class="row-name">${escapeHtml(r.name)}</div>
          </div>
          <span class="history-qty">${fmtNum(r.qty)} ${unitLabel(r.unit)}</span>
        </li>
      `).join('') : `<li class="cart-row"><span class="hint">Nenhum item comprado nesse mês.</span></li>`}
    </ul>
  `;
}

function renderCartView(){
  const container = document.getElementById('view-cart');
  const candidates = getCartCandidates();

  const suggestionsHtml = candidates.length ? `
    <div class="cart-section-title">Sugestões (abaixo do estoque mínimo) <span class="count">${candidates.length}</span></div>
    <ul class="suggestion-list">
      ${candidates.map(c => `
        <li class="suggestion-row">
          <div class="suggestion-row-thumb">${c.item.photo ? `<img loading="lazy" decoding="async" src="${c.item.photo}">` : (c.type==='ingredient' ? '🥫' : '🧴')}</div>
          <div class="row-main">
            <div class="row-name">${escapeHtml(c.item.name)}</div>
            <div class="row-sub">tem ${fmtNum(c.item.stockCurrent)}${unitLabel(c.item.unit)} · mínimo ${fmtNum(c.item.stockMin)}${unitLabel(c.item.unit)}</div>
          </div>
          <span class="type-tag">${c.type==='ingredient' ? 'ingrediente' : 'despensa'}</span>
          <button class="btn-ghost" data-add-cart="${c.type}:${c.item.id}">+ Adicionar</button>
        </li>
      `).join('')}
    </ul>
  ` : `<div class="cart-section-title">Sugestões (abaixo do estoque mínimo) <span class="count">0</span></div><p class="hint" style="margin-bottom:22px;">Nada abaixo do mínimo no momento — ou já está tudo no carrinho.</p>`;

  const cartRows = state.cart.map(c => {
    const source = c.refType==='ingredient' ? state.ingredients : state.despensaItems;
    const live = source.find(i => i.id === c.refId);
    const name = live ? live.name : (c.name + ' (removido)');
    const unit = live ? live.unit : c.unit;
    const photo = live ? live.photo : null;
    const cost = live ? costForQuantity(live, c.quantity || 0) : null;
    return { c, live, name, unit, photo, cost };
  });

  const totalAll = cartRows.reduce((s,r)=> s + (r.cost || 0), 0);
  const totalChecked = cartRows.filter(r=>r.c.checked).reduce((s,r)=> s + (r.cost || 0), 0);

  const cartHtml = cartRows.length ? `
    <div class="cart-section-title">Meu carrinho <span class="count">${cartRows.length}</span></div>
    <ul class="cart-list">
      ${cartRows.map(r => `
        <li class="cart-row ${r.c.checked ? 'checked' : ''}">
          <input type="checkbox" class="cart-check" data-cart-check="${r.c.id}" ${r.c.checked ? 'checked' : ''}>
          <div class="cart-row-thumb">${r.photo ? `<img loading="lazy" decoding="async" src="${r.photo}">` : (r.c.refType==='ingredient' ? '🥫' : '🧴')}</div>
          <div class="row-main">
            <div class="row-name">${escapeHtml(r.name)}</div>
            <div class="row-sub"><span class="type-tag">${r.c.refType==='ingredient' ? 'ingrediente' : 'despensa'}</span></div>
          </div>
          <input type="number" class="cart-qty-input" min="0" step="any" value="${r.c.quantity}" data-cart-qty="${r.c.id}">
          <span class="row-sub">${unitLabel(r.unit)}</span>
          <span class="cart-row-cost">${r.cost !== null ? fmtCurrency(r.cost) : '—'}</span>
          <button class="mini-btn" data-remove-cart="${r.c.id}" title="Remover">✕</button>
        </li>
      `).join('')}
    </ul>
    <div class="cart-footer-bar">
      <div class="cart-total-block">
        <div class="cart-total-line">Total estimado do carrinho: <strong>${fmtCurrency(totalAll)}</strong></div>
        <div class="cart-total-line sub">Marcados para comprar agora: ${fmtCurrency(totalChecked)}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-ghost" id="cart-select-all">Marcar todos como comprados</button>
        <button class="btn-primary" id="cart-checkout-btn">Finalizar compra (itens marcados)</button>
      </div>
    </div>
  ` : `<div class="cart-section-title">Meu carrinho <span class="count">0</span></div><div class="empty-state"><div class="glyph">🛒</div><h3>Carrinho vazio</h3><p>Adicione itens a partir das sugestões acima.</p></div>`;

  container.innerHTML = suggestionsHtml + cartHtml + renderPurchaseHistorySection();

  container.querySelectorAll('[data-add-cart]').forEach(btn => {
    btn.onclick = () => {
      const [type, id] = btn.dataset.addCart.split(':');
      const source = type==='ingredient' ? state.ingredients : state.despensaItems;
      const item = source.find(i => i.id === id);
      if(!item) return;
      state.cart.push({ id: uid(), refType: type, refId: id, name: item.name, unit: item.unit, quantity: suggestedQty(item), checked: false });
      saveCart();
      renderCartView();
      updateTabBadges();
    };
  });
  container.querySelectorAll('[data-cart-check]').forEach(chk => {
    chk.onchange = () => {
      const entry = state.cart.find(c => c.id === chk.dataset.cartCheck);
      if(entry){ entry.checked = chk.checked; saveCart(); renderCartView(); }
    };
  });
  container.querySelectorAll('[data-cart-qty]').forEach(inp => {
    inp.onchange = () => {
      const entry = state.cart.find(c => c.id === inp.dataset.cartQty);
      if(entry){ entry.quantity = parseFloat(inp.value) || 0; saveCart(); renderCartView(); }
    };
  });
  container.querySelectorAll('[data-remove-cart]').forEach(btn => {
    btn.onclick = () => {
      state.cart = state.cart.filter(c => c.id !== btn.dataset.removeCart);
      saveCart();
      renderCartView();
      updateTabBadges();
    };
  });
  const selectAllBtn = document.getElementById('cart-select-all');
  if(selectAllBtn) selectAllBtn.onclick = () => {
    state.cart.forEach(c => c.checked = true);
    saveCart();
    renderCartView();
  };
  const checkoutBtn = document.getElementById('cart-checkout-btn');
  if(checkoutBtn) checkoutBtn.onclick = () => {
    const toProcess = state.cart.filter(c => c.checked);
    if(!toProcess.length){ toast('Marque os itens que você comprou antes de finalizar', 'error'); return; }
    let updated = 0;
    toProcess.forEach(c => {
      const source = c.refType==='ingredient' ? state.ingredients : state.despensaItems;
      const idx = source.findIndex(i => i.id === c.refId);
      if(idx >= 0){
        source[idx].stockCurrent = (source[idx].stockCurrent || 0) + (c.quantity || 0);
        logPurchase(c.refType, c.refId, source[idx].name, source[idx].unit, c.quantity || 0);
        updated++;
      }
    });
    state.cart = state.cart.filter(c => !c.checked);
    saveIngredients();
    saveDespensa();
    saveCart();
    saveHistory();
    toast(`Estoque atualizado com ${updated} ite${updated===1?'m':'ns'} do carrinho`, 'success');
    renderAll();
  };

  const historySelect = document.getElementById('history-month-select');
  if(historySelect) historySelect.onchange = (e) => { historySelectedMonth = e.target.value; renderCartView(); };
}

/* ============================================================
   CARDÁPIO (planejamento de refeições)
============================================================ */
const MEAL_SLOTS = [
  { id:'cafe', label:'Café da manhã' },
  { id:'lanche_manha', label:'Lanche da manhã' },
  { id:'almoco', label:'Almoço' },
  { id:'lanche_tarde', label:'Lanche da tarde' },
  { id:'jantar', label:'Jantar' },
  { id:'ceia', label:'Ceia' }
];
const SLOT_ORDER = MEAL_SLOTS.map(x => x.id);
const WEEKDAY_SHORT = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
let planView = 'week';
let planAnchor = toISO(new Date());

function slotLabel(id){ const x = MEAL_SLOTS.find(m => m.id === id); return x ? x.label : id; }
function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function fromISO(str){ const p = str.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function weekdayIdx(d){ return (d.getDay() + 6) % 7; }
function startOfWeek(d){ return addDays(d, -weekdayIdx(d)); }
function fmtDayMonth(d){ return d.getDate() + ' ' + MONTH_NAMES_PT[d.getMonth()].slice(0,3).toLowerCase(); }
function fmtBR(iso){ const p = iso.split('-'); return p[2] + '/' + p[1]; }

function recipeNutritionTotal(rec){
  const t = { calories:0, protein:0, carbs:0, fat:0 };
  (rec.ingredients || []).forEach(ri => {
    const ing = state.ingredients.find(i => i.id === ri.ingredientId);
    if(!ing) return;
    const n = nutritionForQuantity(ing, ri.quantity || 0);
    t.calories += n.calories; t.protein += n.protein; t.carbs += n.carbs; t.fat += n.fat;
  });
  return t;
}
function mealNutrition(m){
  if(m.custom){
    const c = m.customNutrition || {};
    return {
      calories: c.calories || 0, protein: c.protein || 0, carbs: c.carbs || 0, fat: c.fat || 0,
      missing: { protein: c.protein == null, carbs: c.carbs == null, fat: c.fat == null }
    };
  }
  const rec = state.recipes.find(r => r.id === m.recipeId);
  if(!rec) return null;
  const t = recipeNutritionTotal(rec);
  const f = (m.servings || 1) / (rec.servings || 1);
  return { calories: t.calories*f, protein: t.protein*f, carbs: t.carbs*f, fat: t.fat*f };
}
function sumNutrition(list){
  return list.reduce((a, n) => ({
    calories: a.calories + n.calories, protein: a.protein + n.protein, carbs: a.carbs + n.carbs, fat: a.fat + n.fat,
    missing: {
      protein: !!(a.missing.protein || (n.missing && n.missing.protein)),
      carbs: !!(a.missing.carbs || (n.missing && n.missing.carbs)),
      fat: !!(a.missing.fat || (n.missing && n.missing.fat))
    }
  }), { calories:0, protein:0, carbs:0, fat:0, missing:{ protein:false, carbs:false, fat:false } });
}
function r0(n){ return fmtNum(Math.round(n)); }
function fmtMacros(n){
  const v = (k) => (n.missing && n.missing[k]) ? '–' : r0(n[k]) + 'g';
  return `P ${v('protein')} · C ${v('carbs')} · G ${v('fat')}`;
}
function macroTotalHtml(t){
  const star = (k) => t.missing[k] ? '*' : '';
  const partial = (t.missing.protein || t.missing.carbs || t.missing.fat)
    ? '<br><span title="Alguma refeição avulsa não informou esse dado">* parcial</span>' : '';
  return `Proteína ${r0(t.protein)}g${star('protein')}<br>Carbo ${r0(t.carbs)}g${star('carbs')}<br>Gordura ${r0(t.fat)}g${star('fat')}${partial}`;
}
function mealTitle(m){
  if(m.custom) return m.customName || 'Refeição avulsa';
  const rec = state.recipes.find(r => r.id === m.recipeId);
  return rec ? rec.name : '(receita removida)';
}

function mealsOnDate(iso){
  const wd = weekdayIdx(fromISO(iso));
  return state.mealPlan.filter(m => {
    if(m.repeat === 'weekly'){
      if(iso < m.date) return false;
      if(m.until && iso > m.until) return false;
      if(!(m.days || []).includes(wd)) return false;
      if((m.exceptions || []).includes(iso)) return false;
      return true;
    }
    return m.date === iso;
  }).sort((a,b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
}

function defaultPlanDate(){
  const todayIso = toISO(new Date());
  const a = fromISO(planAnchor);
  if(planView === 'week'){
    const s = startOfWeek(a);
    return (todayIso >= toISO(s) && todayIso <= toISO(addDays(s,6))) ? todayIso : toISO(s);
  }
  const first = new Date(a.getFullYear(), a.getMonth(), 1);
  return (todayIso.slice(0,7) === toISO(first).slice(0,7)) ? todayIso : toISO(first);
}

function mealChipHtml(m, iso){
  const rec = state.recipes.find(r => r.id === m.recipeId);
  const n = mealNutrition(m);
  const recur = m.repeat === 'weekly' ? '<span title="Se repete toda semana">↻</span>' : '';
  const mult = (m.servings || 1) !== 1 ? ` <span style="color:var(--text-faint);font-weight:400;">×${fmtNum(m.servings)}</span>` : '';
  return `
    <button class="meal-chip" data-plan-edit="${m.id}" data-plan-occ="${iso}">
      <div class="meal-slot"><span>${escapeHtml(slotLabel(m.slot))}${m.custom ? ' · fora' : ''}</span>${recur}</div>
      <div class="meal-name">${escapeHtml(mealTitle(m))}${mult}</div>
      ${n ? `<div class="meal-macros">${r0(n.calories)} kcal<br>${fmtMacros(n)}${rec && rec.prepTime ? `<br>⏱ ${fmtMinutes(rec.prepTime)}` : ''}</div>` : ''}
    </button>`;
}

function renderWeekGrid(start){
  const todayIso = toISO(new Date());
  let html = '<div class="week-scroll"><div class="week-grid">';
  for(let i = 0; i < 7; i++){
    const d = addDays(start, i);
    const iso = toISO(d);
    const meals = mealsOnDate(iso);
    const total = sumNutrition(meals.map(mealNutrition).filter(Boolean));
    html += `
      <div class="day-col ${iso === todayIso ? 'today' : ''}">
        <div class="day-head"><span class="dow">${WEEKDAY_SHORT[i]}</span><span class="dnum">${d.getDate()}</span></div>
        <div class="day-meals">
          ${meals.map(m => mealChipHtml(m, iso)).join('')}
          <button class="meal-add" data-plan-add="${iso}">+ refeição</button>
        </div>
        <div class="day-total">
          <div class="lbl">Total do dia</div>
          <div class="kcal">${r0(total.calories)} kcal</div>
          <div class="macros">${macroTotalHtml(total)}</div>
        </div>
      </div>`;
  }
  return html + '</div></div>';
}

function renderMonthGrid(anchor){
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const last = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
  const gridStart = startOfWeek(first);
  const gridEnd = addDays(startOfWeek(last), 6);
  const todayIso = toISO(new Date());
  let html = '<div class="month-grid">' + WEEKDAY_SHORT.map(w => `<div class="month-dow">${w}</div>`).join('');
  for(let d = gridStart; d <= gridEnd; d = addDays(d, 1)){
    const iso = toISO(d);
    const meals = mealsOnDate(iso);
    const total = sumNutrition(meals.map(mealNutrition).filter(Boolean));
    const lines = meals.slice(0,3).map(m => `<div class="mline">${escapeHtml(mealTitle(m))}</div>`).join('');
    const more = meals.length > 3 ? `<div class="mline">+${meals.length - 3} mais</div>` : '';
    html += `
      <button class="month-cell ${d.getMonth() !== anchor.getMonth() ? 'other' : ''} ${iso === todayIso ? 'today' : ''}" data-plan-day="${iso}">
        <div class="mnum">${d.getDate()}</div>
        ${lines}${more}
        ${meals.length ? `<div class="mkcal">${r0(total.calories)} kcal</div>` : ''}
      </button>`;
  }
  return html + '</div>';
}

function renderPlanView(){
  const container = document.getElementById('view-plan');
  const anchor = fromISO(planAnchor);
  let title, body;
  if(planView === 'week'){
    const start = startOfWeek(anchor);
    const end = addDays(start, 6);
    title = start.getMonth() === end.getMonth()
      ? `${start.getDate()} – ${end.getDate()} de ${MONTH_NAMES_PT[end.getMonth()].toLowerCase()} de ${end.getFullYear()}`
      : `${fmtDayMonth(start)} – ${fmtDayMonth(end)} de ${end.getFullYear()}`;
    body = renderWeekGrid(start);
  } else {
    title = `${MONTH_NAMES_PT[anchor.getMonth()]} de ${anchor.getFullYear()}`;
    body = renderMonthGrid(anchor);
  }

  container.innerHTML = `
    <div class="plan-toolbar">
      <div class="plan-nav">
        <button class="icon-btn" id="plan-prev" title="Anterior">◀</button>
        <button class="icon-btn" id="plan-today">Hoje</button>
        <button class="icon-btn" id="plan-next" title="Próximo">▶</button>
      </div>
      <div class="plan-title">${title}</div>
      <div style="flex:1;"></div>
      <div class="seg">
        <button id="plan-view-week" class="${planView === 'week' ? 'active' : ''}">Semana</button>
        <button id="plan-view-month" class="${planView === 'month' ? 'active' : ''}">Mês</button>
      </div>
      <button class="btn-secondary" id="plan-add-out">+ Fora de casa</button>
      <button class="btn-primary" id="plan-add">+ Refeição</button>
    </div>
    ${state.recipes.length ? '' : '<p class="hint" style="margin-bottom:14px;">Cadastre receitas na aba Receitas para montar o cardápio, ou lance refeições avulsas (fora de casa) pelo botão acima.</p>'}
    ${body}
  `;

  const shift = (dir) => {
    if(planView === 'week') planAnchor = toISO(addDays(anchor, 7*dir));
    else planAnchor = toISO(new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1));
    renderPlanView();
  };
  document.getElementById('plan-prev').onclick = () => shift(-1);
  document.getElementById('plan-next').onclick = () => shift(1);
  document.getElementById('plan-today').onclick = () => { planAnchor = toISO(new Date()); renderPlanView(); };
  document.getElementById('plan-view-week').onclick = () => { planView = 'week'; renderPlanView(); };
  document.getElementById('plan-view-month').onclick = () => { planView = 'month'; renderPlanView(); };
  document.getElementById('plan-add').onclick = () => openMealForm({ date: defaultPlanDate() });
  document.getElementById('plan-add-out').onclick = () => openMealForm({ date: defaultPlanDate(), mode: 'custom' });

  container.querySelectorAll('[data-plan-add]').forEach(btn => {
    btn.onclick = () => openMealForm({ date: btn.dataset.planAdd });
  });
  container.querySelectorAll('[data-plan-edit]').forEach(btn => {
    btn.onclick = () => openMealForm({ id: btn.dataset.planEdit, occ: btn.dataset.planOcc });
  });
  container.querySelectorAll('[data-plan-day]').forEach(btn => {
    btn.onclick = () => { planView = 'week'; planAnchor = btn.dataset.planDay; renderPlanView(); };
  });
}

function mealPreviewText(recipeId, servings){
  const rec = state.recipes.find(r => r.id === recipeId);
  if(!rec) return 'Selecione uma receita para ver calorias e macros.';
  const n = mealNutrition({ recipeId, servings });
  let txt = `${r0(n.calories)} kcal · ${fmtMacros(n)}`;
  if(rec.prepTime) txt += ` · ⏱ ${fmtMinutes(rec.prepTime)}`;
  if(n.calories === 0) txt += '<br>(sem dados nutricionais — confira os ingredientes da receita)';
  return txt;
}

          <select id="meal-recipe">
            <option value="">Selecione...</option>
            ${recipesSorted.map(r => `<option value="${r.id}" ${editing && editing.recipeId === r.id ? 'selected' : ''}>${escapeHtml(r.name)}</option>`).join('')}

        <div class="hint" style="margin:-4px 0 14px 0;">Só as calorias são obrigatórias. O que ficar em branco aparece como parcial (*) no total do dia, em vez de contar como zero.</div>
      </div>

      <div class="field">
        <label>Repetição</label>
        <div class="radio-row">
          <label><input type="radio" name="meal-repeat" value="none" ${repeat === 'none' ? 'checked' : ''}> Só neste dia</label>
          <label><input type="radio" name="meal-repeat" value="weekly" ${repeat === 'weekly' ? 'checked' : ''}> Repetir toda semana</label>
        </div>
      </div>
      <div class="field">
        <label id="meal-date-label">${repeat === 'weekly' ? 'Começa em' : 'Data'}</label>
        <input type="date" id="meal-date" value="${baseDate}">
      </div>
      <div id="meal-repeat-box" style="display:${repeat === 'weekly' ? 'block' : 'none'};">
        <div class="field">
          <label>Nos dias</label>
          <div class="weekday-chips">
            ${WEEKDAY_SHORT.map((w,i) => `<label class="chip-check"><input type="checkbox" class="meal-day" value="${i}" ${days.includes(i) ? 'checked' : ''}><span>${w}</span></label>`).join('')}
          </div>
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
            <button type="button" class="btn-ghost" data-preset="all">Todos os dias</button>
            <button type="button" class="btn-ghost" data-preset="weekdays">Seg–Sex</button>
            <button type="button" class="btn-ghost" data-preset="weekend">Fim de semana</button>
          </div>
        </div>
        <div class="field">
          <label>Repetir até (opcional)</label>
          <input type="date" id="meal-until" value="${editing && editing.until ? editing.until : ''}">
          <div class="hint">Deixe vazio para repetir sem data final.${editing && repeat === 'weekly' ? ' Alterações valem para toda a série.' : ''}</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      ${editing ? `<button class="btn-danger-ghost" id="meal-delete-btn" style="margin-right:auto;">Excluir</button>` : ''}
      ${editing && opts.occ ? `<button class="btn-ghost" id="meal-swap-btn" title="Remove esta refeição neste dia e lança uma avulsa no lugar">Troquei por outra coisa</button>` : ''}
      <button class="btn-secondary" id="meal-cancel-btn">Cancelar</button>
      <button class="btn-primary" id="meal-save-btn">${editing ? 'Salvar alterações' : (opts.replace ? 'Substituir' : 'Adicionar ao cardápio')}</button>
    </div>
  `;

  openModal(html, () => {
    const $ = (id) => document.getElementById(id);
    $('close-modal-btn').onclick = closeModal;
    $('meal-cancel-btn').onclick = closeModal;

    const applyMode = () => {
      $('meal-recipe-box').style.display = mode === 'recipe' ? 'block' : 'none';
      $('meal-custom-box').style.display = mode === 'custom' ? 'block' : 'none';
      $('meal-servings-field').style.display = mode === 'recipe' ? '' : 'none';
      $('meal-mode-recipe').classList.toggle('active', mode === 'recipe');
      $('meal-mode-custom').classList.toggle('active', mode === 'custom');
    };
    $('meal-mode-recipe').onclick = () => { mode = 'recipe'; applyMode(); };
    $('meal-mode-custom').onclick = () => { mode = 'custom'; applyMode(); };
    applyMode();

    const updatePreview = () => {
      $('meal-preview').innerHTML = mealPreviewText($('meal-recipe').value, parseFloat($('meal-servings').value) || 1);
    };
    $('meal-recipe').onchange = updatePreview;
    $('meal-servings').oninput = updatePreview;
    updatePreview();

    document.querySelectorAll('input[name="meal-repeat"]').forEach(radio => {
      radio.onchange = () => {
        const weekly = document.querySelector('input[name="meal-repeat"]:checked').value === 'weekly';
        $('meal-repeat-box').style.display = weekly ? 'block' : 'none';
        $('meal-date-label').textContent = weekly ? 'Começa em' : 'Data';
      };
    });

    document.querySelectorAll('[data-preset]').forEach(btn => {
      btn.onclick = () => {
        const sets = { all:[0,1,2,3,4,5,6], weekdays:[0,1,2,3,4], weekend:[5,6] };
        const chosen = sets[btn.dataset.preset];
        document.querySelectorAll('.meal-day').forEach(cb => { cb.checked = chosen.includes(parseInt(cb.value, 10)); });
      };
    });

    if(editing){
      $('meal-delete-btn').onclick = () => { closeModal(); deleteMeal(editing.id, opts.occ); };
      if(opts.occ){
        $('meal-swap-btn').onclick = () => {
          closeModal();
          openMealForm({ date: opts.occ, mode: 'custom', slot: editing.slot, replace: { id: editing.id, occ: opts.occ } });
        };
      }
    }

    $('meal-save-btn').onclick = () => {
      let recipeId = '', servings = 1, customName = '', customNutrition = null;
      if(mode === 'recipe'){
        recipeId = $('meal-recipe').value;
        if(!recipeId){ toast('Escolha uma receita', 'error'); return; }
        servings = parseFloat($('meal-servings').value);
        if(!(servings > 0)) servings = 1;
      } else {
        customName = $('meal-custom-name').value.trim();
        if(!customName){ toast('Diga o que você comeu', 'error'); return; }
        const kcal = parseFloat($('meal-custom-kcal').value);
        if(!(kcal >= 0)){ toast('Informe as calorias', 'error'); return; }
        const opt = (id) => { const v = parseFloat($(id).value); return isNaN(v) ? null : v; };
        customNutrition = { calories: kcal, protein: opt('meal-custom-prot'), carbs: opt('meal-custom-carb'), fat: opt('meal-custom-fat') };
      }
      const date = $('meal-date').value;
      if(!date){ toast('Escolha a data', 'error'); return; }
      const rep = document.querySelector('input[name="meal-repeat"]:checked').value;
      const daysSel = Array.from(document.querySelectorAll('.meal-day:checked')).map(cb => parseInt(cb.value, 10));
      if(rep === 'weekly' && !daysSel.length){ toast('Escolha ao menos um dia da semana', 'error'); return; }
      const until = rep === 'weekly' ? $('meal-until').value : '';
      if(until && until < date){ toast('A data final precisa ser depois da inicial', 'error'); return; }

      const data = {
        id: editing ? editing.id : uid(),
        recipeId,
        slot: $('meal-slot').value,
        servings,
        date,
        repeat: rep,
        days: rep === 'weekly' ? daysSel : [],
        until,
        exceptions: (editing && rep === 'weekly') ? (editing.exceptions || []) : []
      };
      if(mode === 'custom'){ data.custom = true; data.customName = customName; data.customNutrition = customNutrition; }

      if(editing){
        const idx = state.mealPlan.findIndex(m => m.id === editing.id);
        state.mealPlan[idx] = data;
        toast('Refeição atualizada', 'success');
      } else {
        state.mealPlan.push(data);
        if(opts.replace){
          const orig = state.mealPlan.find(x => x.id === opts.replace.id);
          if(orig){
            if(orig.repeat === 'weekly') orig.exceptions = [...(orig.exceptions || []), opts.replace.occ];
            else state.mealPlan = state.mealPlan.filter(x => x.id !== orig.id);
          }
          toast('Refeição substituída', 'success');
        } else {
          toast('Refeição adicionada ao cardápio', 'success');
        }
      }
      saveMealPlan();
      closeModal();
      renderAll();
    };
  });
}

function deleteMeal(id, occIso){
  const m = state.mealPlan.find(x => x.id === id);
  if(!m) return;
  if(m.repeat !== 'weekly'){
    if(!confirm('Excluir esta refeição do cardápio?')) return;
    state.mealPlan = state.mealPlan.filter(x => x.id !== id);
    saveMealPlan();
    toast('Refeição excluída', 'success');
    renderAll();
    return;
  }
  const html = `
    <div class="modal-header">
      <h2>Excluir refeição recorrente</h2>
      <button class="modal-close" id="close-modal-btn">×</button>
    </div>
    <div class="modal-body">
      <p style="margin:0 0 14px 0;font-size:13.5px;color:var(--text-dim);">Esta refeição se repete toda semana. O que você quer excluir?</p>
      <div class="choice-actions">
        ${occIso ? `<button class="btn-secondary" id="del-one">Só o dia ${fmtBR(occIso)}</button>` : ''}
        ${occIso ? `<button class="btn-secondary" id="del-forward">Este dia e os próximos</button>` : ''}
        <button class="btn-danger-ghost" id="del-all">Todas as ocorrências (a série inteira)</button>
        <button class="btn-ghost" id="del-cancel">Cancelar</button>
      </div>
    </div>
  `;
  openModal(html, () => {
    const done = (msg) => { saveMealPlan(); closeModal(); toast(msg, 'success'); renderAll(); };
    document.getElementById('close-modal-btn').onclick = closeModal;
    document.getElementById('del-cancel').onclick = closeModal;
    document.getElementById('del-all').onclick = () => {
      state.mealPlan = state.mealPlan.filter(x => x.id !== id);
      done('Série excluída');
    };
    if(occIso){
      document.getElementById('del-one').onclick = () => {
        m.exceptions = [...(m.exceptions || []), occIso];
        done('Refeição removida só desse dia');
      };
      document.getElementById('del-forward').onclick = () => {
        const prev = toISO(addDays(fromISO(occIso), -1));
        if(prev < m.date) state.mealPlan = state.mealPlan.filter(x => x.id !== id);
        else m.until = prev;
        done('Refeição removida deste dia em diante');
      };
    }
  });
}

/* ============================================================
   EXPORT / IMPORT
============================================================ */
function exportData(){
  const payload = {
    schema: 'despensa-receitas',
    version: 4,
    exportedAt: new Date().toISOString(),
    ingredients: state.ingredients,
    recipes: state.recipes,
    despensaItems: state.despensaItems,
    cart: state.cart,
    purchaseLog: state.purchaseLog,
    mealPlan: state.mealPlan
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `despensa-receitas-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Dados exportados', 'success');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const payload = JSON.parse(e.target.result);
      if(!payload.ingredients || !payload.recipes) throw new Error('formato inválido');
      if(!confirm('Importar irá substituir todos os dados atuais. Continuar?')) return;
      state.ingredients = payload.ingredients;
      state.recipes = payload.recipes;
      state.despensaItems = payload.despensaItems || [];
      state.cart = payload.cart || [];
      state.purchaseLog = payload.purchaseLog || {};
      state.mealPlan = payload.mealPlan || [];
      saveIngredients();
      saveRecipes();
      saveDespensa();
      saveCart();
      saveHistory();
      saveMealPlan();
      toast('Dados importados com sucesso', 'success');
      renderAll();
    }catch(err){
      toast('Arquivo inválido. Verifique o JSON exportado.', 'error');
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   INIT
============================================================ */
function renderAll(){
  if(currentTab === 'ingredients') renderIngredientsView();
  else if(currentTab === 'despensa') renderDespensaView();
  else if(currentTab === 'recipes') renderRecipesView();
  else if(currentTab === 'plan') renderPlanView();
  else if(currentTab === 'cart') renderCartView();
  updateTabBadges();
}

function updateTabBadges(){
  const lowIngCount = state.ingredients.filter(i => stockStatus(i)==='low').length;
  const lowDespCount = state.despensaItems.filter(i => stockStatus(i)==='low').length;
  const cartCount = state.cart.length;
  document.getElementById('tab-btn-ingredients').innerHTML = 'Ingredientes' + (lowIngCount>0 ? `<span class="tab-badge">${lowIngCount}</span>` : '');
  document.getElementById('tab-btn-despensa').innerHTML = 'Despensa' + (lowDespCount>0 ? `<span class="tab-badge">${lowDespCount}</span>` : '');
  document.getElementById('tab-btn-cart').innerHTML = 'Carrinho de Compras' + (cartCount>0 ? `<span class="tab-badge">${cartCount}</span>` : '');
}

async function init(){
  loadLocalState();
  document.getElementById('tab-btn-ingredients').onclick = () => switchTab('ingredients');
  document.getElementById('tab-btn-despensa').onclick = () => switchTab('despensa');
  document.getElementById('tab-btn-recipes').onclick = () => switchTab('recipes');
  document.getElementById('tab-btn-plan').onclick = () => switchTab('plan');
  document.getElementById('tab-btn-cart').onclick = () => switchTab('cart');
  document.getElementById('btn-export').onclick = exportData;
  document.getElementById('btn-import').onclick = () => document.getElementById('import-file-input').click();
  document.getElementById('btn-sync-now').onclick = () => syncFromCloud(true);
  document.getElementById('import-file-input').onchange = (e) => {
    const file = e.target.files[0];
    if(file) importData(file);
    e.target.value = '';
  };
  renderAll();
  await syncFromCloud(false);
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
