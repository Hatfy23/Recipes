============================================================ */
function openRecipeDetail(id){
  const rec = state.recipes.find(r=>r.id===id);
  if(!rec) return;
  let currentServings = rec.servings || 1;

  function buildBody(){
    const readiness = computeReadiness(rec, currentServings);
    const factor = currentServings / (rec.servings||1);
    let totalNutrition = { calories:0, protein:0, carbs:0, fat:0 };
    let totalCost = 0;
    readiness.rows.forEach(r => {
      if(r.ing){
        const n = nutritionForQuantity(r.ing, r.needed);
        totalNutrition.calories += n.calories;
        totalNutrition.protein += n.protein;
        totalNutrition.carbs += n.carbs;
        totalNutrition.fat += n.fat;
        totalCost += costForQuantity(r.ing, r.needed);
      }
    });
    const perServing = { calories: totalNutrition.calories/currentServings, protein: totalNutrition.protein/currentServings };

    return `
      <div class="detail-photo">${rec.photo ? `<img loading="lazy" decoding="async" src="${rec.photo}">` : '🍲'}</div>

      ${readiness.ready
        ? `<div class="banner good">✓ Você tem todos os ingredientes para esta receita.</div>`
        : `<div class="banner bad">⚠ Faltam ${readiness.rows.filter(r=>!r.ok).length} ingrediente(s) para fazer esta receita.</div>`}

      <div class="servings-control">
        <span style="font-size:12.5px;color:var(--text-dim);">Porções:</span>
        <button class="step-btn" id="serv-minus">−</button>
        <span class="servings-val">${currentServings}</span>
        <button class="step-btn" id="serv-plus">+</button>
        ${rec.prepTime ? `<span style="margin-left:14px;font-size:12.5px;color:var(--text-dim);">⏱ Preparo: <strong style="color:var(--text);font-family:var(--font-mono);">${fmtMinutes(rec.prepTime)}</strong></span>` : ''}
      </div>

      <ul class="ingredient-check-list">
        ${readiness.rows.map(r => `
          <li>
            <span class="ic-left">
              <span class="ic-name">
                <span class="ic-mark ${r.ok?'yes':'no'}">${r.ok?'✓':'✕'}</span>
                ${r.ing ? escapeHtml(r.ing.name) : '<em style="color:var(--text-faint)">ingrediente removido</em>'}
              </span>
              ${r.ing ? `<span class="ic-nutri">${ingNutriLine(r.ing, r.needed)}</span>` : ''}
            </span>
            <span class="ic-qty">
              ${fmtNum(r.needed)}${r.ing ? unitLabel(r.ing.unit) : ''}${r.ing && r.ing.portionSize > 0 ? ` (${fmtNum(r.needed / r.ing.portionSize)} × ${escapeHtml(r.ing.portionName || 'porção')})` : ''} necessário · ${fmtNum(r.have)}${r.ing ? unitLabel(r.ing.unit) : ''} em casa
              ${!r.ok ? `<span class="ic-missing"> (faltam ${fmtNum(r.missing)}${r.ing?unitLabel(r.ing.unit):''})</span>` : ''}
            </span>
          </li>
        `).join('') || `<li><span style="color:var(--text-faint);">Nenhum ingrediente adicionado a esta receita.</span></li>`}
      </ul>

      <div class="stat-row">
        <div class="stat-box"><div class="val">${fmtNum(totalNutrition.calories)}</div><div class="lbl">kcal total</div></div>
        <div class="stat-box"><div class="val">${fmtNum(perServing.calories)}</div><div class="lbl">kcal / porção</div></div>
        <div class="stat-box"><div class="val">${fmtNum(totalNutrition.protein)}g</div><div class="lbl">proteína total</div></div>
        <div class="stat-box"><div class="val">${fmtCurrency(totalCost)}</div><div class="lbl">custo estimado</div></div>
      </div>

      ${(rec.videoLink || rec.siteLink) ? `
      <div class="link-row">
        ${rec.videoLink ? `<a class="link-btn" href="${escapeHtml(rec.videoLink)}" target="_blank" rel="noopener">▶ Assistir no YouTube</a>` : ''}
        ${rec.siteLink ? `<a class="link-btn" href="${escapeHtml(rec.siteLink)}" target="_blank" rel="noopener">🔗 Ver receita original</a>` : ''}
      </div>` : ''}

      ${rec.instructions ? `<div class="instructions-block">${escapeHtml(rec.instructions)}</div>` : ''}
      ${rec.notes ? `<div class="hint" style="margin-bottom:10px;">Notas: ${escapeHtml(rec.notes)}</div>` : ''}
    `;
  }

  function render(){
    document.getElementById('recipe-detail-body').innerHTML = buildBody();
    document.getElementById('serv-minus').onclick = () => { if(currentServings>1){ currentServings--; render(); } };
    document.getElementById('serv-plus').onclick = () => { currentServings++; render(); };
  }

  const html = `
    <div class="modal-header">
      <h2>${escapeHtml(rec.name)}</h2>
      <button class="modal-close" id="close-modal-btn">×</button>
    </div>
    <div class="modal-body" id="recipe-detail-body"></div>
    <div class="modal-footer">
      <button class="btn-ghost" id="detail-edit-btn" style="margin-right:auto;">Editar</button>
      <button class="btn-secondary" id="detail-close-btn">Fechar</button>
      <button class="btn-primary" id="detail-cook-btn">Cozinhei isso! (baixar do estoque)</button>
    </div>
  `;

  openModal(html, () => {
    render();
    document.getElementById('close-modal-btn').onclick = closeModal;
    document.getElementById('detail-close-btn').onclick = closeModal;
    document.getElementById('detail-edit-btn').onclick = () => { closeModal(); openRecipeForm(rec.id); };
    document.getElementById('detail-cook-btn').onclick = () => {
      const readiness = computeReadiness(rec, currentServings);
      const missing = readiness.rows.filter(r=>!r.ok);
      if(missing.length){
        if(!confirm(`Faltam ingredientes para ${missing.length} item(ns). Deseja baixar o estoque mesmo assim (ficará em 0 onde faltar)?`)) return;
      }
      readiness.rows.forEach(r => {
        if(r.ing){
          const idx = state.ingredients.findIndex(i=>i.id===r.ing.id);
          state.ingredients[idx].stockCurrent = Math.max(0, state.ingredients[idx].stockCurrent - r.needed);
        }
      });
      saveIngredients();
      toast('Estoque atualizado com base na receita', 'success');
      closeModal();
      renderAll();
    };
  });
}

/* ============================================================
   RENDER: CART VIEW (carrinho de compras)
============================================================ */
function getCartCandidates(){
  // itens abaixo do mínimo, tanto ingredientes quanto despensa, que ainda não estão no carrinho
  const inCart = (type, id) => state.cart.some(c => c.refType===type && c.refId===id);
  const fromIngredients = state.ingredients
    .filter(i => stockStatus(i)==='low' && !inCart('ingredient', i.id))
    .map(i => ({ type:'ingredient', item:i }));
  const fromDespensa = state.despensaItems
    .filter(i => stockStatus(i)==='low' && !inCart('despensa', i.id))
    .map(i => ({ type:'despensa', item:i }));
  return [...fromIngredients, ...fromDespensa].sort((a,b)=>a.item.name.localeCompare(b.item.name,'pt-BR'));
}

function suggestedQty(item){
  if(item.stockMax && item.stockMax > item.stockCurrent) return Math.round((item.stockMax - item.stockCurrent)*100)/100;
  return Math.max(1, Math.round((item.stockMin - item.stockCurrent)*100)/100);
}

function addToCartManual(type, id){
  const source = type==='ingredient' ? state.ingredients : state.despensaItems;
  const item = source.find(i => i.id === id);
  if(!item) return;
  if(state.cart.some(c => c.refType===type && c.refId===id)){
    toast('Esse item já está no carrinho', 'error');
    return;
  }
  state.cart.push({ id: uid(), refType: type, refId: id, name: item.name, unit: item.unit, quantity: suggestedQty(item), checked: false });
  saveCart();
  toast(`${item.name} adicionado ao carrinho`, 'success');
  updateTabBadges();
  if(currentTab === 'cart') renderCartView();
}

function renderPurchaseHistorySection(){
  const months = Object.keys(state.purchaseLog).sort().reverse();
  if(!months.length){
    return `
      <div class="cart-section-title" style="margin-top:28px;">Histórico de compras <span class="count">0</span></div>
      <p class="hint" style="margin-bottom:10px;">Nenhuma compra finalizada ainda. Ao dar check-out no carrinho, os itens entram aqui, somados por mês.</p>
    `;
  }
  const selected = (historySelectedMonth && months.includes(historySelectedMonth)) ? historySelectedMonth : months[0];
  const bucket = state.purchaseLog[selected] || {};
  const rows = Object.values(bucket).sort((a,b)=> a.name.localeCompare(b.name,'pt-BR'));

  return `
    <div class="cart-section-title" style="margin-top:28px;">Histórico de compras <span class="count">${months.length} ${months.length===1?'mês':'meses'}</span></div>
    <div class="toolbar" style="margin-bottom:10px;">
      <select class="filter-select" id="history-month-select">
        ${months.map(m => `<option value="${m}" ${m===selected?'selected':''}>${monthLabel(m)}</option>`).join('')}
      </select>
    </div>
    <ul class="cart-list">
      ${rows.length ? rows.map(r => `
        <li class="cart-row">
          <div class="row-main">
            <div class="row-name">${escapeHtml(r.name)}</div>
          </div>
          <span class="history-qty">${fmtNum(r.qty)} ${unitLabel(r.unit)}</span>
        </li>
      `).join('') : `<li class="cart-row"><span class="hint">Nenhum item comprado nesse mês.</span></li>`}
    </ul>
  `;
}

function renderCartView(){
  const container = document.getElementById('view-cart');
  const candidates = getCartCandidates();

  const suggestionsHtml = candidates.length ? `
    <div class="cart-section-title">Sugestões (abaixo do estoque mínimo) <span class="count">${candidates.length}</span></div>
    <ul class="suggestion-list">
      ${candidates.map(c => `
        <li class="suggestion-row">
          <div class="suggestion-row-thumb">${c.item.photo ? `<img loading="lazy" decoding="async" src="${c.item.photo}">` : (c.type==='ingredient' ? '🥫' : '🧴')}</div>
          <div class="row-main">
            <div class="row-name">${escapeHtml(c.item.name)}</div>
            <div class="row-sub">tem ${fmtNum(c.item.stockCurrent)}${unitLabel(c.item.unit)} · mínimo ${fmtNum(c.item.stockMin)}${unitLabel(c.item.unit)}</div>
          </div>
          <span class="type-tag">${c.type==='ingredient' ? 'ingrediente' : 'despensa'}</span>
          <button class="btn-ghost" data-add-cart="${c.type}:${c.item.id}">+ Adicionar</button>
        </li>
      `).join('')}
    </ul>
  ` : `<div class="cart-section-title">Sugestões (abaixo do estoque mínimo) <span class="count">0</span></div><p class="hint" style="margin-bottom:22px;">Nada abaixo do mínimo no momento — ou já está tudo no carrinho.</p>`;

  const cartRows = state.cart.map(c => {
    const source = c.refType==='ingredient' ? state.ingredients : state.despensaItems;
    const live = source.find(i => i.id === c.refId);
    const name = live ? live.name : (c.name + ' (removido)');
    const unit = live ? live.unit : c.unit;
    const photo = live ? live.photo : null;
    const cost = live ? costForQuantity(live, c.quantity || 0) : null;
    return { c, live, name, unit, photo, cost };
  });

  const totalAll = cartRows.reduce((s,r)=> s + (r.cost || 0), 0);
  const totalChecked = cartRows.filter(r=>r.c.checked).reduce((s,r)=> s + (r.cost || 0), 0);

  const cartHtml = cartRows.length ? `
    <div class="cart-section-title">Meu carrinho <span class="count">${cartRows.length}</span></div>
    <ul class="cart-list">
      ${cartRows.map(r => `
        <li class="cart-row ${r.c.checked ? 'checked' : ''}">
          <input type="checkbox" class="cart-check" data-cart-check="${r.c.id}" ${r.c.checked ? 'checked' : ''}>
          <div class="cart-row-thumb">${r.photo ? `<img loading="lazy" decoding="async" src="${r.photo}">` : (r.c.refType==='ingredient' ? '🥫' : '🧴')}</div>
          <div class="row-main">
            <div class="row-name">${escapeHtml(r.name)}</div>
            <div class="row-sub"><span class="type-tag">${r.c.refType==='ingredient' ? 'ingrediente' : 'despensa'}</span></div>
          </div>
          <input type="number" class="cart-qty-input" min="0" step="any" value="${r.c.quantity}" data-cart-qty="${r.c.id}">
          <span class="row-sub">${unitLabel(r.unit)}</span>
          <span class="cart-row-cost">${r.cost !== null ? fmtCurrency(r.cost) : '—'}</span>
          <button class="mini-btn" data-remove-cart="${r.c.id}" title="Remover">✕</button>
        </li>
      `).join('')}
    </ul>
    <div class="cart-footer-bar">
      <div class="cart-total-block">
        <div class="cart-total-line">Total estimado do carrinho: <strong>${fmtCurrency(totalAll)}</strong></div>
        <div class="cart-total-line sub">Marcados para comprar agora: ${fmtCurrency(totalChecked)}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-ghost" id="cart-select-all">Marcar todos como comprados</button>
        <button class="btn-primary" id="cart-checkout-btn">Finalizar compra (itens marcados)</button>
      </div>
    </div>
  ` : `<div class="cart-section-title">Meu carrinho <span class="count">0</span></div><div class="empty-state"><div class="glyph">🛒</div><h3>Carrinho vazio</h3><p>Adicione itens a partir das sugestões acima.</p></div>`;

  container.innerHTML = suggestionsHtml + cartHtml + renderPurchaseHistorySection();

  container.querySelectorAll('[data-add-cart]').forEach(btn => {
    btn.onclick = () => {
      const [type, id] = btn.dataset.addCart.split(':');
      const source = type==='ingredient' ? state.ingredients : state.despensaItems;
      const item = source.find(i => i.id === id);
      if(!item) return;
      state.cart.push({ id: uid(), refType: type, refId: id, name: item.name, unit: item.unit, quantity: suggestedQty(item), checked: false });
      saveCart();
      renderCartView();
      updateTabBadges();
    };
  });
  container.querySelectorAll('[data-cart-check]').forEach(chk => {
    chk.onchange = () => {
      const entry = state.cart.find(c => c.id === chk.dataset.cartCheck);
      if(entry){ entry.checked = chk.checked; saveCart(); renderCartView(); }
    };
  });
  container.querySelectorAll('[data-cart-qty]').forEach(inp => {
    inp.onchange = () => {
      const entry = state.cart.find(c => c.id === inp.dataset.cartQty);
      if(entry){ entry.quantity = parseFloat(inp.value) || 0; saveCart(); renderCartView(); }
    };
  });
  container.querySelectorAll('[data-remove-cart]').forEach(btn => {
    btn.onclick = () => {
      state.cart = state.cart.filter(c => c.id !== btn.dataset.removeCart);
      saveCart();
      renderCartView();
      updateTabBadges();
    };
  });
  const selectAllBtn = document.getElementById('cart-select-all');
  if(selectAllBtn) selectAllBtn.onclick = () => {
    state.cart.forEach(c => c.checked = true);
    saveCart();
    renderCartView();
  };
  const checkoutBtn = document.getElementById('cart-checkout-btn');
  if(checkoutBtn) checkoutBtn.onclick = () => {
    const toProcess = state.cart.filter(c => c.checked);
    if(!toProcess.length){ toast('Marque os itens que você comprou antes de finalizar', 'error'); return; }
    let updated = 0;
    toProcess.forEach(c => {
      const source = c.refType==='ingredient' ? state.ingredients : state.despensaItems;
      const idx = source.findIndex(i => i.id === c.refId);
      if(idx >= 0){
        source[idx].stockCurrent = (source[idx].stockCurrent || 0) + (c.quantity || 0);
        logPurchase(c.refType, c.refId, source[idx].name, source[idx].unit, c.quantity || 0);
        updated++;
      }
    });
    state.cart = state.cart.filter(c => !c.checked);
    saveIngredients();
    saveDespensa();
    saveCart();
    saveHistory();
    toast(`Estoque atualizado com ${updated} ite${updated===1?'m':'ns'} do carrinho`, 'success');
    renderAll();
  };

  const historySelect = document.getElementById('history-month-select');
  if(historySelect) historySelect.onchange = (e) => { historySelectedMonth = e.target.value; renderCartView(); };
}

/* ============================================================
   CARDÁPIO (planejamento de refeições)
============================================================ */
const MEAL_SLOTS = [
  { id:'cafe', label:'Café da manhã' },
  { id:'lanche_manha', label:'Lanche da manhã' },
  { id:'almoco', label:'Almoço' },
  { id:'lanche_tarde', label:'Lanche da tarde' },
  { id:'jantar', label:'Jantar' },
  { id:'ceia', label:'Ceia' }
];
const SLOT_ORDER = MEAL_SLOTS.map(x => x.id);
const WEEKDAY_SHORT = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
let planView = 'week';
let planAnchor = toISO(new Date());

function slotLabel(id){ const x = MEAL_SLOTS.find(m => m.id === id); return x ? x.label : id; }
function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function fromISO(str){ const p = str.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function weekdayIdx(d){ return (d.getDay() + 6) % 7; }
function startOfWeek(d){ return addDays(d, -weekdayIdx(d)); }
function fmtDayMonth(d){ return d.getDate() + ' ' + MONTH_NAMES_PT[d.getMonth()].slice(0,3).toLowerCase(); }
function fmtBR(iso){ const p = iso.split('-'); return p[2] + '/' + p[1]; }

function recipeNutritionTotal(rec){
  const t = { calories:0, protein:0, carbs:0, fat:0 };
  (rec.ingredients || []).forEach(ri => {
    const ing = state.ingredients.find(i => i.id === ri.ingredientId);
    if(!ing) return;
    const n = nutritionForQuantity(ing, ri.quantity || 0);
    t.calories += n.calories; t.protein += n.protein; t.carbs += n.carbs; t.fat += n.fat;
  });
  return t;
}
function nutritionFromInput(input, basis, unit, portionSize){
  if(basis !== 'portion' || !(portionSize > 0)) return { calories: input.calories, protein: input.protein, carbs: input.carbs, fat: input.fat };
  const f = unit === 'un' ? 1 / portionSize : 100 / portionSize;
  const r = (v) => Math.round((v || 0) * f * 10000) / 10000;
  return { calories: r(input.calories), protein: r(input.protein), carbs: r(input.carbs), fat: r(input.fat) };
}
function ingNutriLine(ing, qty){
  if(!ing) return '';
  const nu = ing.nutrition || {};
  if(!(nu.calories || nu.protein || nu.carbs || nu.fat)) return '<span class="ic-warn">sem dados nutricionais — edite o ingrediente</span>';
  const n = nutritionForQuantity(ing, qty);
  return `${fmtNum(n.calories)} kcal · P ${fmtNum(n.protein)}g · C ${fmtNum(n.carbs)}g · G ${fmtNum(n.fat)}g`;
}

function mealNutrition(m){
  if(m.custom){
    const c = m.customNutrition || {};
    return {
      calories: c.calories || 0, protein: c.protein || 0, carbs: c.carbs || 0, fat: c.fat || 0,
      missing: { protein: c.protein == null, carbs: c.carbs == null, fat: c.fat == null }
    };
  }
  const rec = state.recipes.find(r => r.id === m.recipeId);
  if(!rec) return null;
  const t = recipeNutritionTotal(rec);
  const f = (m.servings || 1) / (rec.servings || 1);
  return { calories: t.calories*f, protein: t.protein*f, carbs: t.carbs*f, fat: t.fat*f };
}
function sumNutrition(list){
  return list.reduce((a, n) => ({
    calories: a.calories + n.calories, protein: a.protein + n.protein, carbs: a.carbs + n.carbs, fat: a.fat + n.fat,
    missing: {
      protein: !!(a.missing.protein || (n.missing && n.missing.protein)),
      carbs: !!(a.missing.carbs || (n.missing && n.missing.carbs)),
      fat: !!(a.missing.fat || (n.missing && n.missing.fat))
    }
  }), { calories:0, protein:0, carbs:0, fat:0, missing:{ protein:false, carbs:false, fat:false } });
}
function r0(n){ return fmtNum(Math.round(n)); }
function fmtMacros(n){
  const v = (k) => (n.missing && n.missing[k]) ? '–' : r0(n[k]) + 'g';
  return `P ${v('protein')} · C ${v('carbs')} · G ${v('fat')}`;
}
function macroTotalHtml(t){
  const star = (k) => t.missing[k] ? '*' : '';
  const partial = (t.missing.protein || t.missing.carbs || t.missing.fat)
    ? '<br><span title="Alguma refeição avulsa não informou esse dado">* parcial</span>' : '';
  return `Proteína ${r0(t.protein)}g${star('protein')}<br>Carbo ${r0(t.carbs)}g${star('carbs')}<br>Gordura ${r0(t.fat)}g${star('fat')}${partial}`;
}
function mealTitle(m){
  if(m.custom) return m.customName || 'Refeição avulsa';
  const rec = state.recipes.find(r => r.id === m.recipeId);
  return rec ? rec.name : '(receita removida)';
}

function mealsOnDate(iso){
  const wd = weekdayIdx(fromISO(iso));
  return state.mealPlan.filter(m => {
    if(m.repeat === 'weekly'){
      if(iso < m.date) return false;
      if(m.until && iso > m.until) return false;
      if(!(m.days || []).includes(wd)) return false;
      if((m.exceptions || []).includes(iso)) return false;
      return true;
    }
    return m.date === iso;
  }).sort((a,b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
}

function defaultPlanDate(){
  const todayIso = toISO(new Date());
  const a = fromISO(planAnchor);
  if(planView === 'week'){
    const s = startOfWeek(a);
    return (todayIso >= toISO(s) && todayIso <= toISO(addDays(s,6))) ? todayIso : toISO(s);
  }
  const first = new Date(a.getFullYear(), a.getMonth(), 1);
  return (todayIso.slice(0,7) === toISO(first).slice(0,7)) ? todayIso : toISO(first);
}

function mealChipHtml(m, iso){
  const rec = state.recipes.find(r => r.id === m.recipeId);
  const n = mealNutrition(m);
  const recur = m.repeat === 'weekly' ? '<span title="Se repete toda semana">↻</span>' : '';
  const mult = (m.servings || 1) !== 1 ? ` <span style="color:var(--text-faint);font-weight:400;">×${fmtNum(m.servings)}</span>` : '';
  return `
    <button class="meal-chip" data-plan-edit="${m.id}" data-plan-occ="${iso}">
      <div class="meal-slot"><span>${escapeHtml(slotLabel(m.slot))}${m.custom ? (m.consumeOf ? ' · consumo' : ' · fora') : ''}</span>${recur}</div>
      <div class="meal-name">${escapeHtml(mealTitle(m))}${mult}</div>
      ${n ? `<div class="meal-macros">${r0(n.calories)} kcal<br>${fmtMacros(n)}${rec && rec.prepTime ? `<br>⏱ ${fmtMinutes(rec.prepTime)}` : ''}</div>` : ''}
    </button>`;
}

function renderWeekGrid(start){
  const todayIso = toISO(new Date());
  let html = '<div class="week-scroll"><div class="week-grid">';
  for(let i = 0; i < 7; i++){
    const d = addDays(start, i);
    const iso = toISO(d);
    const meals = mealsOnDate(iso);
    const total = sumNutrition(meals.map(mealNutrition).filter(Boolean));
    html += `
      <div class="day-col ${iso === todayIso ? 'today' : ''}">
        <div class="day-head"><span class="dow">${WEEKDAY_SHORT[i]}</span><span class="dnum">${d.getDate()}</span></div>
        <div class="day-meals">
          ${meals.map(m => mealChipHtml(m, iso)).join('')}
          <button class="meal-add" data-plan-add="${iso}">+ refeição</button>
        </div>
        <div class="day-total">
          <div class="lbl">Total do dia</div>
          <div class="kcal">${r0(total.calories)} kcal</div>
          ${goalBlockHtml(iso, total)}
          <div class="macros">${macroTotalHtml(total)}</div>
        </div>
      </div>`;
  }
  return html + '</div></div>';
}

function renderMonthGrid(anchor){
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const last = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0);
  const gridStart = startOfWeek(first);
  const gridEnd = addDays(startOfWeek(last), 6);
  const todayIso = toISO(new Date());
  let html = '<div class="month-grid">' + WEEKDAY_SHORT.map(w => `<div class="month-dow">${w}</div>`).join('');
  for(let d = gridStart; d <= gridEnd; d = addDays(d, 1)){
    const iso = toISO(d);
    const meals = mealsOnDate(iso);
    const total = sumNutrition(meals.map(mealNutrition).filter(Boolean));
    const lines = meals.slice(0,3).map(m => `<div class="mline">${escapeHtml(mealTitle(m))}</div>`).join('');
    const more = meals.length > 3 ? `<div class="mline">+${meals.length - 3} mais</div>` : '';
    html += `
      <button class="month-cell ${d.getMonth() !== anchor.getMonth() ? 'other' : ''} ${iso === todayIso ? 'today' : ''}" data-plan-day="${iso}">
        <div class="mnum">${d.getDate()}</div>
        ${lines}${more}
        ${meals.length ? `<div class="mkcal">${r0(total.calories)}${goalForDate(iso) ? ' / ' + fmtNum(goalForDate(iso).kcal) : ''} kcal</div>` : ''}
      </button>`;
  }
  return html + '</div>';
}

function renderPlanView(){
  const container = document.getElementById('view-plan');
  const anchor = fromISO(planAnchor);
  let title, body;
  if(planView === 'week'){
    const start = startOfWeek(anchor);
    const end = addDays(start, 6);
    title = start.getMonth() === end.getMonth()
      ? `${start.getDate()} – ${end.getDate()} de ${MONTH_NAMES_PT[end.getMonth()].toLowerCase()} de ${end.getFullYear()}`
      : `${fmtDayMonth(start)} – ${fmtDayMonth(end)} de ${end.getFullYear()}`;
    body = renderWeekGrid(start);
  } else {
    title = `${MONTH_NAMES_PT[anchor.getMonth()]} de ${anchor.getFullYear()}`;
    body = renderMonthGrid(anchor);
  }

  container.innerHTML = `
    <div class="plan-toolbar">
      <div class="plan-nav">
        <button class="icon-btn" id="plan-prev" title="Anterior">◀</button>
        <button class="icon-btn" id="plan-today">Hoje</button>
        <button class="icon-btn" id="plan-next" title="Próximo">▶</button>
      </div>
      <div class="plan-title">${title}</div>
      <div style="flex:1;"></div>
      <button class="icon-btn" id="plan-goal" title="Metas diárias de calorias e proteína">🎯 ${goalChipText()}</button>
      <button class="icon-btn" id="plan-report" title="Relatório de consumo vs. metas">📊 Relatório</button>
      <div class="seg">
        <button id="plan-view-week" class="${planView === 'week' ? 'active' : ''}">Semana</button>
        <button id="plan-view-month" class="${planView === 'month' ? 'active' : ''}">Mês</button>
      </div>
      <button class="btn-secondary" id="plan-add-out">+ Fora de casa</button>
      <button class="btn-primary" id="plan-add">+ Refeição</button>
    </div>
    ${state.recipes.length ? '' : '<p class="hint" style="margin-bottom:14px;">Cadastre receitas na aba Receitas para montar o cardápio, ou lance refeições avulsas (fora de casa) pelo botão acima.</p>'}
    ${body}
  `;

  const shift = (dir) => {
    if(planView === 'week') planAnchor = toISO(addDays(anchor, 7*dir));
    else planAnchor = toISO(new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1));
    renderPlanView();
  };
  document.getElementById('plan-prev').onclick = () => shift(-1);
  document.getElementById('plan-next').onclick = () => shift(1);
  document.getElementById('plan-today').onclick = () => { planAnchor = toISO(new Date()); renderPlanView(); };
  document.getElementById('plan-view-week').onclick = () => { planView = 'week'; renderPlanView(); };
  document.getElementById('plan-view-month').onclick = () => { planView = 'month'; renderPlanView(); };
  document.getElementById('plan-add').onclick = () => openMealForm({ date: defaultPlanDate() });
  document.getElementById('plan-goal').onclick = () => openGoalForm();
  document.getElementById('plan-report').onclick = () => openReportForm();
  document.getElementById('plan-add-out').onclick = () => openMealForm({ date: defaultPlanDate(), mode: 'custom' });

  container.querySelectorAll('[data-goal-day]').forEach(btn => {
    btn.onclick = () => openDayGoalForm(btn.dataset.goalDay);
  });
  container.querySelectorAll('[data-plan-add]').forEach(btn => {
    btn.onclick = () => openMealForm({ date: btn.dataset.planAdd });
  });
  container.querySelectorAll('[data-plan-edit]').forEach(btn => {
    btn.onclick = () => openMealForm({ id: btn.dataset.planEdit, occ: btn.dataset.planOcc });
  });
  container.querySelectorAll('[data-plan-day]').forEach(btn => {
    btn.onclick = () => { planView = 'week'; planAnchor = btn.dataset.planDay; renderPlanView(); };
  });
}

function mealPreviewText(recipeId, servings){
  const rec = state.recipes.find(r => r.id === recipeId);
  if(!rec) return 'Selecione uma receita para ver calorias e macros.';
  const n = mealNutrition({ recipeId, servings });
  let txt = `${r0(n.calories)} kcal · ${fmtMacros(n)}`;
  if(rec.prepTime) txt += ` · ⏱ ${fmtMinutes(rec.prepTime)}`;
  if(n.calories === 0) txt += '<br>(sem dados nutricionais — confira os ingredientes da receita)';
  return txt;
}

function openMealForm(opts){
  opts = opts || {};
  const editing = opts.id ? state.mealPlan.find(m => m.id === opts.id) : null;
  let mode = editing ? (editing.custom ? 'custom' : 'recipe') : (opts.mode || (state.recipes.length ? 'recipe' : 'custom'));

  const recipesSorted = [...state.recipes].sort((a,b) => a.name.localeCompare(b.name, 'pt-BR'));
  const cn = (editing && editing.custom && editing.customNutrition) || {};
  const nv = (v) => (v === null || v === undefined) ? '' : v;
  const slotDefault = editing ? editing.slot : (opts.slot || 'almoco');

  const html = `

      <h2>${title}</h2>
      <button class="modal-close" id="close-modal-btn">×</button>
    </div>

      </div>
      <div class="field-row">
        <div class="field">
          <label>Refeição *</label>
          <select id="meal-slot">${MEAL_SLOTS.map(x => `<option value="${x.id}" ${slotDefault === x.id ? 'selected' : ''}>${x.label}</option>`).join('')}</select>
        </div>
        <div class="field" id="meal-servings-field">
          <label>Porções consumidas *</label>
          <input type="number" id="meal-servings" min="0.25" step="any" value="${editing && !editing.custom ? editing.servings : 1}">
        </div>
      </div>

      <div id="meal-recipe-box">
        <div class="field">
          <label>Receita *</label>
          <select id="meal-recipe">
            <option value="">Selecione...</option>
            ${recipesSorted.map(r => `<option value="${r.id}" ${editing && editing.recipeId === r.id ? 'selected' : ''}>${escapeHtml(r.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><div class="meal-preview" id="meal-preview"></div></div>
      </div>

      <div id="meal-custom-box">
        <div class="field">
          <label>O que você comeu *</label>
          <input type="text" id="meal-custom-name" value="${editing && editing.custom ? escapeHtml(editing.customName || '') : ''}" placeholder="Ex: Pizza do Mario, açaí 500 ml">
        </div>
        <div class="field-row">
          <div class="field"><label>Calorias (kcal) *</label><input type="number" min="0" step="any" id="meal-custom-kcal" value="${nv(cn.calories)}"></div>
          <div class="field"><label>Proteína (g)</label><input type="number" min="0" step="any" id="meal-custom-prot" value="${nv(cn.protein)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Carboidrato (g)</label><input type="number" min="0" step="any" id="meal-custom-carb" value="${nv(cn.carbs)}"></div>
          <div class="field"><label>Gordura (g)</label><input type="number" min="0" step="any" id="meal-custom-fat" value="${nv(cn.fat)}"></div>
        </div>
        <div class="hint" style="margin:-4px 0 14px 0;">Só as calorias são obrigatórias. O que ficar em branco aparece como parcial (*) no total do dia, em vez de contar como zero.</div>
      </div>

      <div class="field">
        <label>Repetição</label>
        <div class="radio-row">
          <label><input type="radio" name="meal-repeat" value="none" ${repeat === 'none' ? 'checked' : ''}> Só neste dia</label>
          <label><input type="radio" name="meal-repeat" value="weekly" ${repeat === 'weekly' ? 'checked' : ''}> Repetir toda semana</label>

      </div>
      <div class="field">
        <label id="meal-date-label">${repeat === 'weekly' ? 'Começa em' : 'Data'}</label>

            <button type="button" class="btn-ghost" data-preset="weekend">Fim de semana</button>

          <input type="date" id="meal-until" value="${editing && editing.until ? editing.until : ''}">

      ${editing ? `<button class="btn-danger-ghost" id="meal-delete-btn" style="margin-right:auto;">Excluir</button>` : ''}

      <button class="btn-secondary" id="meal-cancel-btn">Cancelar</button>

    $('close-modal-btn').onclick = closeModal;

      $('meal-recipe-box').style.display = mode === 'recipe' ? 'block' : 'none';
      $('meal-custom-box').style.display = mode === 'custom' ? 'block' : 'none';
      $('meal-servings-field').style.display = mode === 'recipe' ? '' : 'none';
      $('meal-mode-recipe').classList.toggle('active', mode === 'recipe');
      $('meal-mode-custom').classList.toggle('active', mode === 'custom');
    };
    $('meal-mode-recipe').onclick = () => { mode = 'recipe'; applyMode(); };
    $('meal-mode-custom').onclick = () => { mode = 'custom'; applyMode(); };
    applyMode();

    const updatePreview = () => {
      $('meal-preview').innerHTML = mealPreviewText($('meal-recipe').value, parseFloat($('meal-servings').value) || 1);
    };
    $('meal-recipe').onchange = updatePreview;
    $('meal-servings').oninput = updatePreview;
    updatePreview();

    document.querySelectorAll('input[name="meal-repeat"]').forEach(radio => {
      radio.onchange = () => {
        const weekly = document.querySelector('input[name="meal-repeat"]:checked').value === 'weekly';
        $('meal-repeat-box').style.display = weekly ? 'block' : 'none';
        $('meal-date-label').textContent = weekly ? 'Começa em' : 'Data';

    });

    document.querySelectorAll('[data-preset]').forEach(btn => {
      btn.onclick = () => {

        document.querySelectorAll('.meal-day').forEach(cb => { cb.checked = chosen.includes(parseInt(cb.value, 10)); });
      };
    });

    if(editing){
      $('meal-delete-btn').onclick = () => { closeModal(); deleteMeal(editing.id, opts.occ); };
      if(opts.occ){
        $('meal-swap-btn').onclick = () => {
          closeModal();
          openMealForm({ date: opts.occ, mode: 'custom', slot: editing.slot, replace: { id: editing.id, occ: opts.occ } });
        };
      }
    }

    $('meal-save-btn').onclick = () => {
      let recipeId = '', servings = 1, customName = '', customNutrition = null;
      if(mode === 'recipe'){
        recipeId = $('meal-recipe').value;
        if(!recipeId){ toast('Escolha uma receita', 'error'); return; }
        servings = parseFloat($('meal-servings').value);
        if(!(servings > 0)) servings = 1;
      } else {
        customName = $('meal-custom-name').value.trim();
        if(!customName){ toast('Diga o que você comeu', 'error'); return; }
        const kcal = parseFloat($('meal-custom-kcal').value);
        if(!(kcal >= 0)){ toast('Informe as calorias', 'error'); return; }
        const opt = (id) => { const v = parseFloat($(id).value); return isNaN(v) ? null : v; };
        customNutrition = { calories: kcal, protein: opt('meal-custom-prot'), carbs: opt('meal-custom-carb'), fat: opt('meal-custom-fat') };
      }
      const date = $('meal-date').value;
      if(!date){ toast('Escolha a data', 'error'); return; }
      const rep = document.querySelector('input[name="meal-repeat"]:checked').value;
      const daysSel = Array.from(document.querySelectorAll('.meal-day:checked')).map(cb => parseInt(cb.value, 10));
      if(rep === 'weekly' && !daysSel.length){ toast('Escolha ao menos um dia da semana', 'error'); return; }
      const until = rep === 'weekly' ? $('meal-until').value : '';
      if(until && until < date){ toast('A data final precisa ser depois da inicial', 'error'); return; }

      const data = {
        id: editing ? editing.id : uid(),
        recipeId,
        slot: $('meal-slot').value,
        servings,
        date,
        repeat: rep,
        days: rep === 'weekly' ? daysSel : [],
        until,
        exceptions: (editing && rep === 'weekly') ? (editing.exceptions || []) : []
      };
      if(mode === 'custom'){ data.custom = true; data.customName = customName; data.customNutrition = customNutrition; }

      if(editing){
        const idx = state.mealPlan.findIndex(m => m.id === editing.id);
        state.mealPlan[idx] = data;
        toast('Refeição atualizada', 'success');
      } else {
        state.mealPlan.push(data);
        if(opts.replace){
          const orig = state.mealPlan.find(x => x.id === opts.replace.id);
          if(orig){
            if(orig.repeat === 'weekly') orig.exceptions = [...(orig.exceptions || []), opts.replace.occ];
            else state.mealPlan = state.mealPlan.filter(x => x.id !== orig.id);
          }
          toast('Refeição substituída', 'success');
        } else {
          toast('Refeição adicionada ao cardápio', 'success');
        }
      }
      saveMealPlan();
      closeModal();
      renderAll();
    };
  });
}

/* ---------- Metas (calorias e proteína) ---------- */
function fmtBRFull(iso){ const p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

// Cada entrada do histórico { from, kcal, protein } vale a partir da data "from".
// O dia usa a entrada mais recente com from <= dia. Mudar a meta cria uma entrada nova;
// os dias anteriores continuam usando a entrada que já valia neles.
function goalEntryFor(iso){
  let best = null;
  (state.calorieGoal.history || []).forEach(h => {
    if(h.from <= iso && (!best || h.from > best.from)) best = h;
  });
  return best;
}
function defaultGoalFor(iso, metric){
  const e = goalEntryFor(iso);
  const v = e ? e[metric || 'kcal'] : null;
  return (v === null || v === undefined || v === '') ? null : v;
}
// metric: 'kcal' | 'protein'. Ajuste do dia tem prioridade sobre a meta padrão.
function goalFor(iso, metric){
  const ov = (state.calorieGoal.overrides || {})[iso];
  if(ov && ov[metric] !== null && ov[metric] !== undefined) return { value: ov[metric], source: 'override' };
  const d = defaultGoalFor(iso, metric);
  return d !== null ? { value: d, source: 'default' } : null;
}
function goalForDate(iso){ const g = goalFor(iso, 'kcal'); return g ? { kcal: g.value, source: g.source } : null; }

function goalChipText(){
  const e = goalEntryFor(toISO(new Date()));
  if(!e) return 'Definir metas';
  const parts = [];
  if(e.kcal !== null && e.kcal !== undefined) parts.push(`${fmtNum(e.kcal)} kcal`);
  if(e.protein !== null && e.protein !== undefined) parts.push(`${fmtNum(e.protein)} g prot.`);
  return parts.length ? 'Meta: ' + parts.join(' · ') : 'Definir metas';
}

function goalBlockHtml(iso, total){
  const gk = goalFor(iso, 'kcal');
  const gp = goalFor(iso, 'protein');
  if(!gk && !gp) return `<button class="goal-line goal-none" data-goal-day="${iso}">+ definir meta</button>`;
  let html = '';
  if(gk){
    const pct = gk.value > 0 ? Math.min(100, (total.calories / gk.value) * 100) : 0;
    const diff = Math.round(gk.value - total.calories);
    const over = diff < 0;
    html += `
      <button class="goal-line" data-goal-day="${iso}" title="Alterar a meta só deste dia">
        <div class="goal-top">Meta ${fmtNum(gk.value)} kcal${gk.source === 'override' ? ' · ajustada' : ''} <span class="goal-pencil">✎</span></div>
        <div class="goal-status ${over ? 'over' : ''}">${over ? `passou ${fmtNum(-diff)} kcal` : `faltam ${fmtNum(diff)} kcal`}</div>
      </button>
      <div class="goal-bar"><div class="goal-fill ${over ? 'over' : ''}" style="width:${pct}%;"></div></div>`;
  }
  if(gp){
    const pct = gp.value > 0 ? Math.min(100, (total.protein / gp.value) * 100) : 0;
    const diff = Math.round(gp.value - total.protein);
    const hit = diff <= 0;
    const star = total.missing.protein ? '*' : '';
    const txt = hit ? (diff === 0 ? 'meta batida' : `meta batida (+${fmtNum(-diff)} g)`) : `faltam ${fmtNum(diff)} g`;
    html += `
      <button class="goal-line" data-goal-day="${iso}" title="Alterar a meta só deste dia">
        <div class="goal-top">Proteína ${r0(total.protein)}${star} / ${fmtNum(gp.value)} g${gp.source === 'override' ? ' · ajustada' : ''} <span class="goal-pencil">✎</span></div>
        <div class="goal-status ${hit ? 'hit' : ''}">${txt}</div>
      </button>
      <div class="goal-bar"><div class="goal-fill" style="width:${pct}%;"></div></div>`;
  }
  return html;
}

function openGoalForm(){
  const todayIso = toISO(new Date());
  const curK = defaultGoalFor(todayIso, 'kcal');
  const curP = defaultGoalFor(todayIso, 'protein');
  const hist = [...state.calorieGoal.history].sort((a,b) => b.from.localeCompare(a.from));
  const histLabel = (h) => {
    const parts = [];
    if(h.kcal !== null && h.kcal !== undefined) parts.push(`<strong>${fmtNum(h.kcal)} kcal</strong>`);
    if(h.protein !== null && h.protein !== undefined) parts.push(`<strong>${fmtNum(h.protein)} g</strong> de proteína`);
    return parts.join(' · ') + ` · desde ${fmtBRFull(h.from)}`;
  };
  const html = `
    <div class="modal-header">
      <h2>Metas diárias</h2>
      <button class="modal-close" id="close-modal-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>Calorias (kcal por dia)</label>
          <input type="number" id="goal-kcal" min="1" step="any" value="${curK !== null ? curK : ''}" placeholder="Ex: 2000">
        </div>
        <div class="field">
          <label>Proteína (g por dia)</label>
          <input type="number" id="goal-prot" min="1" step="any" value="${curP !== null ? curP : ''}" placeholder="Ex: 120">
        </div>
      </div>
      <div class="field">
        <label>Vale a partir de *</label>
        <input type="date" id="goal-from" value="${todayIso}">
      </div>
      <div class="hint" style="margin:-4px 0 16px 0;">Preencha uma ou as duas (campo em branco = sem meta dessa). Os dias anteriores a essa data mantêm as metas que já tinham. Para mudar só um dia (treino pesado, dia de descanso...), clique na meta dentro do dia no calendário.</div>
      ${hist.length ? `
      <div class="field">
        <label>Histórico das metas</label>
        <ul class="goal-history">
          ${hist.map(h => `<li><span>${histLabel(h)}</span><button class="mini-btn" data-goal-del="${h.from}" title="Remover esta entrada">✕</button></li>`).join('')}
        </ul>
      </div>` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="goal-cancel-btn">Cancelar</button>
      <button class="btn-primary" id="goal-save-btn">Salvar metas</button>
    </div>
  `;
  openModal(html, () => {
    document.getElementById('close-modal-btn').onclick = closeModal;
    document.getElementById('goal-cancel-btn').onclick = closeModal;
    document.querySelectorAll('[data-goal-del]').forEach(btn => {
      btn.onclick = () => {
        state.calorieGoal.history = state.calorieGoal.history.filter(h => h.from !== btn.dataset.goalDel);
        saveGoal();
        renderAll();
        openGoalForm();
      };
    });
    document.getElementById('goal-save-btn').onclick = () => {
      const kcal = parseFloat(document.getElementById('goal-kcal').value);
      const prot = parseFloat(document.getElementById('goal-prot').value);
      const from = document.getElementById('goal-from').value;
      if(!(kcal > 0) && !(prot > 0)){ toast('Informe ao menos uma meta (calorias ou proteína)', 'error'); return; }
      if(!from){ toast('Escolha a partir de quando vale', 'error'); return; }
      const h = state.calorieGoal.history.filter(x => x.from !== from);
      h.push({ from, kcal: kcal > 0 ? kcal : null, protein: prot > 0 ? prot : null });
      h.sort((a,b) => a.from.localeCompare(b.from));
      state.calorieGoal.history = h;
      saveGoal();
      closeModal();
      toast(`Metas valendo desde ${fmtBR(from)}`, 'success');
      renderAll();
    };
  });
}

function openDayGoalForm(iso){
  const gk = goalFor(iso, 'kcal');
  const gp = goalFor(iso, 'protein');
  const dk = defaultGoalFor(iso, 'kcal');
  const dp = defaultGoalFor(iso, 'protein');
  const ov = state.calorieGoal.overrides[iso];
  const hasOv = !!(ov && ((ov.kcal !== null && ov.kcal !== undefined) || (ov.protein !== null && ov.protein !== undefined)));
  const defTxt = [dk !== null ? `${fmtNum(dk)} kcal` : null, dp !== null ? `${fmtNum(dp)} g de proteína` : null].filter(Boolean).join(' e ');
  const html = `
    <div class="modal-header">
      <h2>Metas do dia ${fmtBR(iso)}</h2>
      <button class="modal-close" id="close-modal-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>Calorias só deste dia (kcal)</label>
          <input type="number" id="dg-kcal" min="1" step="any" value="${gk ? gk.value : ''}" placeholder="Ex: 2400">
        </div>
        <div class="field">
          <label>Proteína só deste dia (g)</label>
          <input type="number" id="dg-prot" min="1" step="any" value="${gp ? gp.value : ''}" placeholder="Ex: 140">
        </div>
      </div>
      <div class="hint">${defTxt ? `A meta padrão deste dia é ${defTxt}. ` : 'Ainda não há meta padrão para este dia. '}O que você digitar aqui vale só para ${fmtBR(iso)} e não muda os outros dias. Campo em branco usa a meta padrão.</div>
    </div>
    <div class="modal-footer">
      ${hasOv ? `<button class="btn-ghost" id="dg-reset-btn" style="margin-right:auto;">Voltar às metas padrão</button>` : ''}
      <button class="btn-secondary" id="dg-cancel-btn">Cancelar</button>
      <button class="btn-primary" id="dg-save-btn">Salvar</button>
    </div>
  `;
  openModal(html, () => {
    document.getElementById('close-modal-btn').onclick = closeModal;
    document.getElementById('dg-cancel-btn').onclick = closeModal;
    if(hasOv){
      document.getElementById('dg-reset-btn').onclick = () => {
        delete state.calorieGoal.overrides[iso];
        saveGoal(); closeModal(); toast('Voltou para as metas padrão', 'success'); renderAll();
      };
    }
    document.getElementById('dg-save-btn').onclick = () => {
      const next = Object.assign({}, state.calorieGoal.overrides[iso] || {});
      const apply = (key, raw, def) => {
        const v = parseFloat(raw);
        if(!(v > 0) || (def !== null && v === def)) delete next[key];
        else next[key] = v;
      };
      apply('kcal', document.getElementById('dg-kcal').value, dk);
      apply('protein', document.getElementById('dg-prot').value, dp);
      if(Object.keys(next).length) state.calorieGoal.overrides[iso] = next;
      else delete state.calorieGoal.overrides[iso];
      saveGoal(); closeModal(); toast('Metas do dia atualizadas', 'success'); renderAll();
    };
  });
}

/* ---------- Relatório de consumo vs. metas ---------- */
function presetRange(preset){
  const t = new Date();
  const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const y = today.getFullYear(), m = today.getMonth();
  if(preset === 'week'){ const st = startOfWeek(today); return [toISO(st), toISO(addDays(st, 6))]; }
  if(preset === 'lastweek'){ const st = addDays(startOfWeek(today), -7); return [toISO(st), toISO(addDays(st, 6))]; }
  if(preset === 'last7') return [toISO(addDays(today, -6)), toISO(today)];
  if(preset === 'month') return [toISO(new Date(y, m, 1)), toISO(new Date(y, m + 1, 0))];
  if(preset === 'lastmonth') return [toISO(new Date(y, m - 1, 1)), toISO(new Date(y, m, 0))];
  return null;
}

// Só dias com refeições registradas e que já chegaram (hoje ou antes) entram nas contas.
function buildReport(from, to){
  const todayIso = toISO(new Date());
  const rows = [];
  const end = fromISO(to);
  let d = fromISO(from), guard = 0;
  while(d <= end && guard++ < 400){
    const iso = toISO(d);
    const meals = mealsOnDate(iso);
    const total = sumNutrition(meals.map(mealNutrition).filter(Boolean));
    rows.push({
      iso, wd: weekdayIdx(d), future: iso > todayIso, count: meals.length,
      rec: meals.length > 0 && iso <= todayIso,
      total, gk: goalFor(iso, 'kcal'), gp: goalFor(iso, 'protein')
    });
    d = addDays(d, 1);
  }
  const recd = rows.filter(r => r.rec);
  const sum = (arr, f) => arr.reduce((a, r) => a + f(r), 0);
  const kRows = recd.filter(r => r.gk);
  const pRows = recd.filter(r => r.gp);
  const kGoalSum = sum(kRows, r => r.gk.value);
  const kOnGoalDays = sum(kRows, r => r.total.calories);
  const pGoalSum = sum(pRows, r => r.gp.value);
  const pOnGoalDays = sum(pRows, r => r.total.protein);
  const sm = {
    recorded: recd.length,
    kcal: sum(recd, r => r.total.calories),
    avgKcal: recd.length ? sum(recd, r => r.total.calories) / recd.length : 0,
    protein: sum(recd, r => r.total.protein),
    avgProtein: recd.length ? sum(recd, r => r.total.protein) / recd.length : 0,
    carbs: sum(recd, r => r.total.carbs),
    fat: sum(recd, r => r.total.fat),
    kGoalDays: kRows.length, kGoalSum, kOnGoalDays,
    balance: kGoalSum - kOnGoalDays,   // > 0 = déficit (comeu menos que a meta)
    daysUnder: kRows.filter(r => r.total.calories < r.gk.value).length,
    daysOver: kRows.filter(r => r.total.calories > r.gk.value).length,
    pGoalDays: pRows.length, pGoalSum, pOnGoalDays,
    proteinDiff: pOnGoalDays - pGoalSum,
    proteinHit: pRows.filter(r => r.total.protein >= r.gp.value).length,
    noKcalGoalDays: recd.length - kRows.length,
    partialDays: recd.filter(r => r.total.missing.protein || r.total.missing.carbs || r.total.missing.fat).length
  };
  return { rows, sm };
}

function fmtSigned(n){ const r = Math.round(n); return (r > 0 ? '+' : '') + fmtNum(r); }

function reportCsv(rep, from, to){
  const q = (v) => {
    const t = (v === null || v === undefined) ? '' : String(v);
    return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const n = (v, dec) => {
    if(v === null || v === undefined || isNaN(v)) return '';
    const f = Math.pow(10, dec);
    return String(Math.round(v * f) / f).replace('.', ',');
  };
  const sm = rep.sm;
  const L = [];
  L.push([ 'Relatório de consumo', fmtBRFull(from) + ' a ' + fmtBRFull(to) ].map(q).join(';'));
  L.push('');
  L.push([ 'Data','Dia','Calorias consumidas','Meta de calorias','Diferença de calorias (consumido - meta)',
           'Proteína (g)','Meta de proteína (g)','Diferença de proteína (g)','Carboidrato (g)','Gordura (g)','Observações' ].map(q).join(';'));
  rep.rows.forEach(r => {
    const obs = [];
    if(r.future) obs.push('dia futuro');
    else if(!r.rec) obs.push('sem registro');
    else {
      if(!r.gk) obs.push('sem meta de calorias');
      if(r.total.missing.protein || r.total.missing.carbs || r.total.missing.fat) obs.push('macros parciais (refeição avulsa sem todos os dados)');
    }
    const has = r.rec;
    L.push([
      fmtBRFull(r.iso), WEEKDAY_SHORT[r.wd],
      has ? n(r.total.calories, 0) : '',
      has && r.gk ? n(r.gk.value, 0) : '',
      has && r.gk ? n(r.total.calories - r.gk.value, 0) : '',
      has ? n(r.total.protein, 1) : '',
      has && r.gp ? n(r.gp.value, 0) : '',
      has && r.gp ? n(r.total.protein - r.gp.value, 1) : '',
      has ? n(r.total.carbs, 1) : '',
      has ? n(r.total.fat, 1) : '',
      obs.join('; ')
    ].map(q).join(';'));
  });
  L.push('');
  L.push([ 'RESUMO DO PERÍODO' ].map(q).join(';'));
  const line = (a, b) => L.push([a, b].map(q).join(';'));
  line('Dias com registro', sm.recorded);
  line('Total consumido (kcal)', n(sm.kcal, 0));
  line('Média diária consumida (kcal)', n(sm.avgKcal, 0));
  line('Dias com registro e meta de calorias', sm.kGoalDays);
  line('Soma das metas desses dias (kcal)', n(sm.kGoalSum, 0));
  line('Dias abaixo da meta', sm.daysUnder);
  line('Dias acima da meta', sm.daysOver);
  if(sm.balance >= 0) line('CALORIAS PERDIDAS (déficit em relação à meta, kcal)', n(sm.balance, 0));
  else line('CALORIAS ACIMA DA META (superávit, kcal)', n(-sm.balance, 0));
  line('Proteína total consumida (g)', n(sm.protein, 1));
  line('Média diária de proteína (g)', n(sm.avgProtein, 1));
  line('Dias com meta de proteína', sm.pGoalDays);
  line('Dias que bateu a meta de proteína', sm.proteinHit);
  line('Proteína consumida - meta, nesses dias (g)', n(sm.proteinDiff, 1));
  line('Carboidrato total (g)', n(sm.carbs, 1));
  line('Gordura total (g)', n(sm.fat, 1));
  if(sm.noKcalGoalDays) line('Observação', sm.noKcalGoalDays + ' dia(s) com registro sem meta de calorias ficaram fora do saldo');
  if(sm.partialDays) line('Observação', sm.partialDays + ' dia(s) com macros parciais (refeição avulsa sem todos os dados)');
  line('Observação', 'Dias sem registro e dias futuros não entram nas contas. "Calorias perdidas" = soma de (meta - consumido) nos dias com registro e meta.');
  return '\ufeff' + L.join('\r\n');
}

function downloadText(filename, text, mime){
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function renderReportBody(from, to){
  const body = document.getElementById('rp-body');
  if(!from || !to || from > to){ body.innerHTML = '<p class="hint">Escolha um período válido.</p>'; return null; }
  if((fromISO(to) - fromISO(from)) / 86400000 > 366){ body.innerHTML = '<p class="hint">O período máximo é de 1 ano.</p>'; return null; }
  const rep = buildReport(from, to);
  const sm = rep.sm;

  const heroDeficit = sm.balance >= 0;
  const hero = sm.kGoalDays ? `
    <div class="report-hero ${heroDeficit ? '' : 'surplus'}">
      <div class="lbl">${heroDeficit ? 'Calorias perdidas (déficit em relação à meta)' : 'Calorias acima da meta (superávit)'}</div>
      <div class="big">${fmtNum(Math.round(Math.abs(sm.balance)))} kcal</div>
      <div class="sub">Soma de (meta − consumido) em ${sm.kGoalDays} dia(s) com registro e meta · ${sm.daysUnder} abaixo, ${sm.daysOver} acima da meta</div>
    </div>` : `
    <div class="report-hero"><div class="lbl">Calorias perdidas</div><div class="big">—</div>
      <div class="sub">Nenhum dia com registro e meta de calorias neste período. Defina uma meta (🎯) e registre refeições.</div></div>`;

  const cards = `
    <div class="stat-row">
      <div class="stat-box"><div class="val">${fmtNum(Math.round(sm.kcal))}</div><div class="lbl">kcal consumidas</div></div>
      <div class="stat-box"><div class="val">${fmtNum(Math.round(sm.avgKcal))}</div><div class="lbl">média kcal / dia</div></div>
      <div class="stat-box"><div class="val">${fmtNum(Math.round(sm.avgProtein))} g</div><div class="lbl">média proteína / dia</div></div>
      <div class="stat-box"><div class="val">${sm.pGoalDays ? sm.proteinHit + '/' + sm.pGoalDays : '—'}</div><div class="lbl">dias que bateu a proteína</div></div>
    </div>`;

  const dayCell = (r, v, cls) => `<td class="${cls || ''}">${v}</td>`;
  const rowsHtml = rep.rows.map(r => {
    const label = `${WEEKDAY_SHORT[r.wd]} ${fmtBR(r.iso)}`;
    if(!r.rec){
      return `<tr class="muted"><td>${label}</td><td colspan="8" style="text-align:left;">${r.future ? 'dia futuro' : 'sem registro'}</td></tr>`;
    }
    const kd = r.gk ? r.total.calories - r.gk.value : null;
    const pd = r.gp ? r.total.protein - r.gp.value : null;
    const star = (k) => r.total.missing[k] ? '*' : '';
    return `<tr>
      <td>${label}</td>
      ${dayCell(r, r0(r.total.calories))}
      ${dayCell(r, r.gk ? fmtNum(r.gk.value) : '—')}
      ${dayCell(r, kd === null ? '—' : fmtSigned(kd), kd === null ? '' : (kd > 0 ? 'over' : 'under'))}
      ${dayCell(r, r0(r.total.protein) + star('protein'))}
      ${dayCell(r, r.gp ? fmtNum(r.gp.value) : '—')}
      ${dayCell(r, pd === null ? '—' : fmtSigned(pd), pd === null ? '' : (pd < 0 ? 'over' : 'under'))}
      ${dayCell(r, r0(r.total.carbs) + star('carbs'))}
      ${dayCell(r, r0(r.total.fat) + star('fat'))}
    </tr>`;
  }).join('');

  const foot = sm.recorded ? `
    <tfoot><tr>
      <td>Total (${sm.recorded} dia${sm.recorded === 1 ? '' : 's'})</td>
      <td>${r0(sm.kcal)}</td>
      <td>${sm.kGoalDays ? fmtNum(Math.round(sm.kGoalSum)) : '—'}</td>
      <td>${sm.kGoalDays ? fmtSigned(sm.kOnGoalDays - sm.kGoalSum) : '—'}</td>
      <td>${r0(sm.protein)}</td>
      <td>${sm.pGoalDays ? fmtNum(Math.round(sm.pGoalSum)) : '—'}</td>
      <td>${sm.pGoalDays ? fmtSigned(sm.proteinDiff) : '—'}</td>
      <td>${r0(sm.carbs)}</td>
      <td>${r0(sm.fat)}</td>
    </tr></tfoot>` : '';

  const notes = [];
  if(sm.noKcalGoalDays) notes.push(`${sm.noKcalGoalDays} dia(s) com registro sem meta de calorias ficaram fora do saldo.`);
  if(sm.partialDays) notes.push(`* ${sm.partialDays} dia(s) com valores parciais (refeição avulsa sem todos os macros).`);
  notes.push('Diferença = consumido − meta (negativo: ficou abaixo). Dias sem registro e dias futuros não entram nas contas.');

  body.innerHTML = `
    ${hero}${cards}
    <div class="report-table-wrap">
      <table class="report-table">
        <thead><tr><th>Dia</th><th>Consumido kcal</th><th>Meta kcal</th><th>Dif. kcal</th><th>Proteína g</th><th>Meta g</th><th>Dif. g</th><th>Carbo g</th><th>Gordura g</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
        ${foot}
      </table>
    </div>
    <div class="hint" style="margin-top:10px;">${notes.join('<br>')}</div>`;
  return rep;
}

/* ---------- Consumo de ingrediente (baixa no estoque + entra nos nutrientes do dia) ---------- */
function slotByTime(){
  const h = new Date().getHours();
  if(h >= 5 && h < 10) return 'cafe';
  if(h >= 10 && h < 12) return 'lanche_manha';
  if(h >= 12 && h < 15) return 'almoco';
  if(h >= 15 && h < 18) return 'lanche_tarde';
  if(h >= 18 && h < 22) return 'jantar';
  return 'ceia';
}

      if(qty > ing.stockCurrent) t += `<br><span style="color:#e0a850;">Estoque insuficiente: vai ficar em 0 (o consumo é registrado por inteiro).</span>`;
      $('cs-preview').innerHTML = t;
    };

    $('cs-cancel-btn').onclick = closeModal;
    $('cs-portions').oninput = refresh;

    $('cs-yest').onclick = () => { $('cs-date').value = yest; };

      if(!(portions > 0)){ toast('Informe quantas porções você consumiu', 'error'); return; }

      if(!date){ toast('Escolha o dia', 'error'); return; }
      if(date > todayIso){ toast('Escolha hoje ou um dia anterior', 'error'); return; }

  });
}

function deleteMeal(id, occIso){
  const m = state.mealPlan.find(x => x.id === id);
  if(!m) return;
  if(m.repeat !== 'weekly'){
    if(!confirm('Excluir esta refeição do cardápio?')) return;
    if(m.consumeOf){
      const ing = state.ingredients.find(i => i.id === m.consumeOf.ingredientId);
      if(ing && confirm(`Devolver ${fmtNum(m.consumeOf.quantity)} ${unitLabel(ing.unit)} de ${ing.name} ao estoque?`)){
        ing.stockCurrent = Math.round((ing.stockCurrent + m.consumeOf.quantity) * 100) / 100;
        saveIngredients();
      }
    }
    state.mealPlan = state.mealPlan.filter(x => x.id !== id);
    saveMealPlan();
    toast('Refeição excluída', 'success');
    renderAll();
    return;
  }
  const html = `
    <div class="modal-header">
      <h2>Excluir refeição recorrente</h2>
      <button class="modal-close" id="close-modal-btn">×</button>
    </div>
    <div class="modal-body">
      <p style="margin:0 0 14px 0;font-size:13.5px;color:var(--text-dim);">Esta refeição se repete toda semana. O que você quer excluir?</p>
      <div class="choice-actions">
        ${occIso ? `<button class="btn-secondary" id="del-one">Só o dia ${fmtBR(occIso)}</button>` : ''}
        ${occIso ? `<button class="btn-secondary" id="del-forward">Este dia e os próximos</button>` : ''}
        <button class="btn-danger-ghost" id="del-all">Todas as ocorrências (a série inteira)</button>
        <button class="btn-ghost" id="del-cancel">Cancelar</button>
      </div>
    </div>
  `;
  openModal(html, () => {
    const done = (msg) => { saveMealPlan(); closeModal(); toast(msg, 'success'); renderAll(); };
    document.getElementById('close-modal-btn').onclick = closeModal;
    document.getElementById('del-cancel').onclick = closeModal;
    document.getElementById('del-all').onclick = () => {
      state.mealPlan = state.mealPlan.filter(x => x.id !== id);
      done('Série excluída');
    };
    if(occIso){
      document.getElementById('del-one').onclick = () => {
        m.exceptions = [...(m.exceptions || []), occIso];
        done('Refeição removida só desse dia');
      };
      document.getElementById('del-forward').onclick = () => {
        const prev = toISO(addDays(fromISO(occIso), -1));
        if(prev < m.date) state.mealPlan = state.mealPlan.filter(x => x.id !== id);
        else m.until = prev;
        done('Refeição removida deste dia em diante');
      };
    }
  });
}

  };

  document.body.appendChild(a);

}

function importData(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const payload = JSON.parse(e.target.result);
      if(!payload.ingredients || !payload.recipes) throw new Error('formato inválido');
      if(!confirm('Importar irá substituir todos os dados atuais. Continuar?')) return;
      state.ingredients = payload.ingredients;
      state.recipes = payload.recipes;
      state.despensaItems = payload.despensaItems || [];
      state.cart = payload.cart || [];
      state.purchaseLog = payload.purchaseLog || {};
      state.mealPlan = payload.mealPlan || [];
      state.calorieGoal = normGoal(payload.calorieGoal);
      saveIngredients();
      saveRecipes();
      saveDespensa();
      saveCart();
      saveHistory();
      saveMealPlan();
      saveGoal();
      toast('Dados importados com sucesso', 'success');
      renderAll();
    }catch(err){
      toast('Arquivo inválido. Verifique o JSON exportado.', 'error');
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   INIT
============================================================ */
function renderAll(){
  if(currentTab === 'ingredients') renderIngredientsView();
  else if(currentTab === 'despensa') renderDespensaView();
  else if(currentTab === 'recipes') renderRecipesView();
  else if(currentTab === 'plan') renderPlanView();
  else if(currentTab === 'cart') renderCartView();
  updateTabBadges();
}

function updateTabBadges(){
  const lowIngCount = state.ingredients.filter(i => stockStatus(i)==='low').length;
  const lowDespCount = state.despensaItems.filter(i => stockStatus(i)==='low').length;
  const cartCount = state.cart.length;
  document.getElementById('tab-btn-ingredients').innerHTML = 'Ingredientes' + (lowIngCount>0 ? `<span class="tab-badge">${lowIngCount}</span>` : '');
  document.getElementById('tab-btn-despensa').innerHTML = 'Despensa' + (lowDespCount>0 ? `<span class="tab-badge">${lowDespCount}</span>` : '');
  document.getElementById('tab-btn-cart').innerHTML = 'Carrinho de Compras' + (cartCount>0 ? `<span class="tab-badge">${cartCount}</span>` : '');
}

let deferredInstallPrompt = null;

function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}

function setupPwa(){
  const btn = document.getElementById('btn-install');
  try{
    const ic = document.createElement('link');
    ic.rel = 'icon'; ic.type = 'image/png'; ic.href = ICON_192;
    document.head.appendChild(ic);
  }catch(e){}
  // Manifesto gerado na hora, com a URL real de onde o arquivo está hospedado (precisa de http/https).
  try{
    if((location.protocol === 'https:' || location.protocol === 'http:') && typeof URL.createObjectURL === 'function' && !document.querySelector('link[rel="manifest"]')){
      const base = location.origin + location.pathname;
      const manifest = {
        id: base,
        name: 'Despensa & Receitas',
        short_name: 'Despensa',
        description: 'Ingredientes, receitas, estoque, cardápio e compras.',
        start_url: base,
        scope: base.replace(/[^/]*$/, ''),
        display: 'standalone',
        orientation: 'any',
        background_color: '#0e0c09',
        theme_color: '#0e0c09',
        lang: 'pt-BR',
        icons: [
          { src: ICON_192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      document.head.appendChild(link);
    }
  }catch(e){ console.warn('Falha ao criar o manifesto', e); }

  if(btn && isStandalone()) btn.style.display = 'none';
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstallPrompt = e; });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    if(btn) btn.style.display = 'none';
    toast('App instalado! Procure o atalho "Despensa" no seu aparelho.', 'success');
  });
}

async function onInstallClick(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(e){}
    deferredInstallPrompt = null;
    return;
  }
  openInstallHelp();
}

function openInstallHelp(){
  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const who = isIOS ? 'ios' : (isAndroid ? 'android' : 'desktop');
  const block = (key, title, steps) => `
    <div class="install-block ${who === key ? 'you' : ''}">
      <h3>${title}${who === key ? '<span class="you-tag">seu aparelho</span>' : ''}</h3>
      <ol>${steps.map(x => `<li>${x}</li>`).join('')}</ol>
    </div>`;
  const html = `
    <div class="modal-header">
      <h2>Instalar como app</h2>
      <button class="modal-close" id="close-modal-btn">×</button>
    </div>
    <div class="modal-body">
      ${location.protocol === 'file:' ? '<div class="banner bad">Você abriu o arquivo direto do computador. Para instalar, abra o app pelo link (https) onde ele está hospedado, como o do GitHub Pages.</div>' : ''}
      ${block('ios', 'iPhone / iPad (Safari)', [
        'Abra o link do app no <strong>Safari</strong>.',
        'Toque em <strong>Compartilhar</strong> (o quadrado com a seta pra cima).',
        'Toque em <strong>Adicionar à Tela de Início</strong> e confirme.'
      ])}
      ${block('android', 'Android (Chrome)', [
        'Abra o link do app no <strong>Chrome</strong>.',
        'Toque no menu <strong>⋮</strong>.',
        'Toque em <strong>Instalar app</strong> (ou <strong>Adicionar à tela inicial</strong>) e confirme.'
      ])}
      ${block('desktop', 'Computador (Chrome ou Edge)', [
        'Abra o link do app no <strong>Chrome</strong> ou no <strong>Edge</strong>.',
        'Chrome: menu <strong>⋮</strong> → <strong>Transmitir, salvar e compartilhar</strong> → <strong>Instalar página como app</strong>.',
        'Edge: menu <strong>⋯</strong> → <strong>Aplicativos</strong> → <strong>Instalar este site como um aplicativo</strong>.',
        'Os nomes do menu podem variar um pouco conforme a versão. O Firefox no computador não instala apps.'
      ])}
      <div class="hint">Depois de instalado, o app abre em janela própria, com ícone no menu iniciar/tela inicial. Seus dados continuam sincronizados com o Supabase.</div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="install-close-btn">Fechar</button>
    </div>
  `;
  openModal(html, () => {
    document.getElementById('close-modal-btn').onclick = closeModal;
    document.getElementById('install-close-btn').onclick = closeModal;
  });
}

async function init(){
  loadLocalState();
  setupPwa();
  document.getElementById('btn-install').onclick = onInstallClick;
  document.getElementById('tab-btn-ingredients').onclick = () => switchTab('ingredients');
  document.getElementById('tab-btn-despensa').onclick = () => switchTab('despensa');
  document.getElementById('tab-btn-recipes').onclick = () => switchTab('recipes');
  document.getElementById('tab-btn-plan').onclick = () => switchTab('plan');
  document.getElementById('tab-btn-cart').onclick = () => switchTab('cart');
  document.getElementById('btn-export').onclick = exportData;
  document.getElementById('btn-import').onclick = () => document.getElementById('import-file-input').click();
  document.getElementById('btn-sync-now').onclick = () => syncFromCloud(true);
  document.getElementById('import-file-input').onchange = (e) => {
    const file = e.target.files[0];
    if(file) importData(file);
    e.target.value = '';
  };
  renderAll();
  await syncFromCloud(false);
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
